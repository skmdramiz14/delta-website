<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DELTA Media — Discover People</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="delta-shared.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{overflow-x:hidden;max-width:100vw;}
:root{
  --navy:#10392D;--navy2:#1a4a3a;
  --gold:#D4AF63;--gold-dark:#B8925A;
  --green:#2da86a;--green2:#1a7a4c;
  --white:#fff;--sand:#ffffff;--cream:#F7F8FA;
  --border:#E7E9EC;--muted:#8A8F98;--charcoal:#1A1A1A;
}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--charcoal);}

.dp-nav{background:#fff;padding:16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:200;}
.dp-back{background:none;border:none;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.dp-back:hover{background:var(--border);}
.dp-nav-title{font-family:'Playfair Display',serif;font-weight:900;font-size:1.1rem;}
.dp-nav-title em{color:var(--gold-dark);font-style:normal;}

.dp-tabs{display:flex;gap:8px;background:#fff;padding:10px 16px;border-bottom:1px solid var(--border);
  position:sticky;top:65px;z-index:190;overflow-x:auto;}
.dp-tab{background:var(--cream);border:none;padding:9px 18px;border-radius:20px;font-weight:700;font-size:.82rem;
  color:var(--muted);cursor:pointer;white-space:nowrap;}
.dp-tab.active{background:var(--navy);color:#fff;}

.dp-scope-row{background:var(--cream);padding:10px 16px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--border);}
.dp-scope-pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;}
.dp-scope-pills::-webkit-scrollbar{display:none;}
.dp-scope-pill{background:#fff;border:1.5px solid var(--border);padding:6px 13px;border-radius:16px;font-size:.72rem;
  font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;flex-shrink:0;}
.dp-scope-pill.active{background:var(--green2);color:#fff;border-color:var(--green2);}
.dp-scope-select{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:.8rem;
  font-family:inherit;background:#fff;color:var(--charcoal);}
.dp-scope-note{font-size:.68rem;color:var(--muted);padding:0 16px;}

.dp-wrap{max-width:640px;margin:0 auto;padding:16px;}
.dp-list{display:flex;flex-direction:column;gap:10px;}
.dp-reel-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.dp-reel-card{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:9/14;background:var(--cream);cursor:pointer;border:1px solid var(--border);}
.dp-reel-card img{width:100%;height:100%;object-fit:cover;display:block;}
.dp-reel-views{position:absolute;bottom:8px;left:8px;color:#fff;font-size:.72rem;font-weight:700;background:rgba(0,0,0,.5);padding:3px 9px;border-radius:9px;}

.dp-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;}
.dp-avatar-wrap{position:relative;width:52px;height:52px;flex-shrink:0;}
.dp-avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--cream);border:1px solid var(--border);display:block;}
.dp-avatar-letter{width:52px;height:52px;border-radius:50%;background:var(--navy);color:var(--gold-dark,#D4AF63);
  display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:800;border:1px solid var(--border);}
.dp-rank{position:absolute;top:-4px;left:-4px;width:20px;height:20px;border-radius:50%;background:var(--gold);
  color:var(--navy);font-size:.65rem;font-weight:800;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;}
.dp-info{flex:1;min-width:0;cursor:pointer;}
.dp-name{font-size:.9rem;font-weight:800;color:var(--charcoal);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dp-sub{font-size:.75rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dp-follow-btn{background:var(--navy);color:#fff;border:none;padding:9px 18px;border-radius:18px;font-weight:700;
  font-size:.78rem;cursor:pointer;flex-shrink:0;}
.dp-follow-btn.following{background:var(--border);color:var(--muted);}

.dp-empty{text-align:center;color:var(--muted);font-size:.85rem;padding:60px 20px;}
.dp-loading{text-align:center;color:var(--muted);font-size:.85rem;padding:40px 20px;}
.dp-load-more{display:block;margin:18px auto 0;background:#fff;border:1px solid var(--border);color:var(--charcoal);
  padding:10px 24px;border-radius:20px;font-weight:700;font-size:.82rem;cursor:pointer;}
</style>
</head>
<body>

<div class="dp-nav">
  <button class="dp-back" onclick="location.href='media-feed.html?city='+CITY" title="Back">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="dp-nav-title">Discover <em>People</em></div>
</div>

<div class="dp-tabs">
  <button class="dp-tab" id="tabAll" onclick="switchTab('all')">All Creators</button>
  <button class="dp-tab" id="tabTop" onclick="switchTab('top')">Top Creators</button>
  <button class="dp-tab" id="tabReels" onclick="switchTab('reels')">Trending Reels</button>
  <button class="dp-tab" id="tabFollow" onclick="switchTab('follow')">Who to Follow</button>
</div>

<div class="dp-scope-row" id="dpScopeRow" style="display:none;">
  <div class="dp-scope-pills" id="dpScopePills"></div>
  <div style="display:flex;gap:6px;align-items:center;flex:1;min-width:200px;">
    <input type="text" class="dp-scope-select" id="dpScopeValueInput" list="dpScopeValueList"
      placeholder="এলাকা লিখে খুঁজুন..." style="flex:1;" onkeydown="if(event.key==='Enter')onScopeValueSearch()">
    <datalist id="dpScopeValueList"></datalist>
    <button onclick="onScopeValueSearch()" style="white-space:nowrap;padding:7px 12px;border-radius:8px;
      border:1.5px solid var(--navy,#10392D);background:var(--navy,#10392D);color:#fff;font-size:.78rem;
      font-weight:700;cursor:pointer;">🔍</button>
  </div>
</div>

<div class="dp-wrap">
  <div class="dp-list" id="dpList">
    <div class="dp-loading">লোড হচ্ছে...</div>
  </div>
  <button class="dp-load-more" id="dpLoadMore" style="display:none;" onclick="loadMore()">আরও দেখুন</button>
</div>

<script>
var fbcfg={apiKey:"AIzaSyA6TrrnCMwv1aa1WPqGvTVWlnieB2pVOEU",authDomain:"delta-platform-82fc0.firebaseapp.com",projectId:"delta-platform-82fc0",storageBucket:"delta-platform-82fc0.firebasestorage.app",messagingSenderId:"444904180433",appId:"1:444904180433:web:6706eba4d73a30cd67d3f0"};
firebase.initializeApp(fbcfg);
var auth=firebase.auth();
var db=firebase.firestore();
var CITY = new URLSearchParams(location.search).get('city') || (function(){ try{ return localStorage.getItem('delta_city'); }catch(e){ return null; } })() || 'manteswar'; // Location Architecture v1 Section 3
var currentUser=null;
var _tabParam = new URLSearchParams(location.search).get('tab');
var activeTab = (['top','reels','follow'].indexOf(_tabParam)>=0) ? _tabParam : 'all';
var PAGE_SIZE = 15;
var lastDoc = null;
var followSet = [];

// ── Hyperlocal-to-global scope config for "All Creators" ──
// Now backed by Firestore's cityConfig collection instead of a hardcoded map
// — adding a new city as DELTA expands (Master Doc Section 11) means adding
// one Firestore document, not editing four HTML files. Self-heals: if no
// cityConfig docs exist yet at all, seeds sensible defaults (only persists
// once the user is logged in, per the Firestore rule).
var ALL_CITY_CONFIGS = {};
// CITY_GEO_SEED_DEFAULTS now comes from delta-shared.js (loaded in <head>).
async function loadAllCityConfigs(){
  try{
    var snap = await db.collection('cityConfig').get();
    snap.docs.forEach(function(d){ ALL_CITY_CONFIGS[d.id] = d.data(); });
  }catch(e){ console.warn('cityConfig list fetch failed', e); }
  if(!Object.keys(ALL_CITY_CONFIGS).length){
    ALL_CITY_CONFIGS = Object.assign({}, CITY_GEO_SEED_DEFAULTS);
    if(auth.currentUser){
      Object.keys(CITY_GEO_SEED_DEFAULTS).forEach(function(id){
        db.collection('cityConfig').doc(id).set(CITY_GEO_SEED_DEFAULTS[id]).catch(function(e){
          console.warn('cityConfig self-heal skipped', e);
        });
      });
    }
  }
}
var scopeLevel = 'city';   // city | district | state | country | all
var scopeValue = CITY;     // the specific value within that level

var DEMO_FOLLOW = [
  {id:'demo-greenpharmacy', displayName:'Green Pharmacy', username:'greenpharmacy', avatarUrl:'https://images.unsplash.com/photo-1587854692152-cbe660dbde88?w=200&q=60'},
  {id:'demo-techzone', displayName:'Tech Zone', username:'techzone', avatarUrl:'https://images.unsplash.com/photo-1518770660439-4636190af475?w=200&q=60'},
  {id:'demo-cakehouse', displayName:'Cake House', username:'cakehouse', avatarUrl:''},
];
var DEMO_TOP = [
  {displayName:'Fresh Mart', avatarUrl:'https://images.unsplash.com/photo-1542838132-92c53300491e?w=200&q=60', count:'12.4K'},
  {displayName:'Fish Corner', avatarUrl:'https://images.unsplash.com/photo-1544943910-4c1dc44aab44?w=200&q=60', count:'8.7K'},
  {displayName:'Salon XYZ', avatarUrl:'https://images.unsplash.com/photo-1560066984-138dadb4c035?w=200&q=60', count:'6.1K'},
];

function requireLogin(){
  alert('Login to engage, share and grow.\n\n☰ মেনু থেকে লগইন করুন।');
}
function dpEscapeAttr(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}
function dpAvatarOrLetter(avatarUrl, name){
  if(avatarUrl){
    return '<img class="dp-avatar dp-avatar-img" src="'+avatarUrl+'" data-fallback-name="'+dpEscapeAttr(name)+'">';
  }
  return '<div class="dp-avatar-letter">'+((name||'?').charAt(0).toUpperCase())+'</div>';
}
// Inline onerror="" attributes are fragile once names/URLs contain quotes or
// special characters — this binds real error listeners after the images are
// in the DOM instead, which is reliable regardless of content.
function dpBindAvatarFallbacks(container){
  (container||document).querySelectorAll('.dp-avatar-img').forEach(function(img){
    img.addEventListener('error', function(){
      var name = img.getAttribute('data-fallback-name') || '?';
      var div = document.createElement('div');
      div.className = 'dp-avatar-letter';
      div.textContent = name.charAt(0).toUpperCase();
      img.replaceWith(div);
    });
  });
}

async function switchTab(tab){
  activeTab = tab;
  lastDoc = null;
  var url = new URL(location.href);
  url.searchParams.set('tab', tab);
  history.replaceState(null, '', url);
  document.getElementById('tabFollow').classList.toggle('active', tab==='follow');
  document.getElementById('tabTop').classList.toggle('active', tab==='top');
  document.getElementById('tabReels').classList.toggle('active', tab==='reels');
  document.getElementById('tabAll').classList.toggle('active', tab==='all');
  document.getElementById('dpScopeRow').style.display = tab==='all' ? 'flex' : 'none';
  document.getElementById('dpList').className = tab==='reels' ? 'dp-reel-grid' : 'dp-list';
  document.getElementById('dpList').innerHTML = '<div class="dp-loading">লোড হচ্ছে...</div>';
  document.getElementById('dpLoadMore').style.display='none';
  if(tab==='follow') loadFollowList(true);
  else if(tab==='top') loadTopList(true);
  else if(tab==='reels') loadReelsList(true);
  else {
    if(!Object.keys(ALL_CITY_CONFIGS).length) await loadAllCityConfigs();
    renderScopePills(); renderScopeValueSelect(); loadAllCreators(true);
  }
}

// ── Scope pills: City / District / State / Country / All ──
var SCOPE_LEVELS = [
  {id:'city', label:'City'},
  {id:'district', label:'District'},
  {id:'state', label:'State'},
  {id:'country', label:'Country'},
  {id:'all', label:'All'}
];
function renderScopePills(){
  var wrap = document.getElementById('dpScopePills');
  wrap.innerHTML = SCOPE_LEVELS.map(function(s){
    return '<button class="dp-scope-pill'+(s.id===scopeLevel?' active':'')+'" onclick="onScopeLevelChange(\''+s.id+'\')">'+s.label+'</button>';
  }).join('');
}
function onScopeLevelChange(level){
  scopeLevel = level;
  // Reset scopeValue to a sensible default whenever the level changes —
  // defaults to whatever the current city belongs to at that level.
  var geo = ALL_CITY_CONFIGS[CITY] || {};
  if(level==='city') scopeValue = CITY;
  else if(level==='district') scopeValue = geo.district;
  else if(level==='state') scopeValue = geo.state;
  else if(level==='country') scopeValue = geo.country;
  else scopeValue = null; // 'all' has no specific value
  renderScopePills();
  renderScopeValueSelect();
  loadAllCreators(true);
}
async function renderScopeValueSelect(){
  var input = document.getElementById('dpScopeValueInput');
  var list = document.getElementById('dpScopeValueList');
  var wrap = input.parentElement;
  if(scopeLevel==='all'){ wrap.style.display='none'; return; }
  wrap.style.display='flex';
  input.value = scopeValue || '';

  var options = [];
  if(scopeLevel==='city'){
    options = Object.keys(ALL_CITY_CONFIGS).map(function(id){ return {value:id, label:ALL_CITY_CONFIGS[id].label||id}; });
  } else {
    // Distinct values at this level across every known DELTA city — grows
    // automatically as new cityConfig documents get added when DELTA expands.
    var seen = {};
    Object.keys(ALL_CITY_CONFIGS).forEach(function(id){
      var v = ALL_CITY_CONFIGS[id][scopeLevel];
      if(v && !seen[v]){ seen[v]=true; options.push({value:v, label:v}); }
    });
  }

  // Merge in real places people have actually registered from, even where
  // DELTA has no cityConfig entry (e.g. someone in Kolkata) — otherwise
  // they'd never appear as a selectable option at all, only findable by
  // someone who already knows the exact name to type.
  try{
    var known = await getKnownLocations();
    var extraList = scopeLevel==='city' ? (known.cities||[]) :
                     scopeLevel==='district' ? (known.districts||[]) :
                     scopeLevel==='state' ? (known.states||[]) :
                     scopeLevel==='country' ? (known.countries||[]) : [];
    var existing = {}; options.forEach(function(o){ existing[o.value]=true; });
    extraList.forEach(function(v){ if(v && !existing[v]){ existing[v]=true; options.push({value:v, label:v}); } });
  }catch(e){ console.warn('Could not merge known locations into scope options', e); }

  options.sort(function(a,b){ return a.label.localeCompare(b.label); });
  list.innerHTML = options.map(function(o){ return '<option value="'+o.value+'">'+o.label+'</option>'; }).join('');
}
function onScopeValueSearch(){
  var val = document.getElementById('dpScopeValueInput').value.trim();
  if(!val) return;
  scopeValue = val;
  loadAllCreators(true);
}

async function loadAllCreators(reset){
  var list = document.getElementById('dpList');
  var loadMoreBtn = document.getElementById('dpLoadMore');
  try{
    var q;
    // Global User Identity Architecture v1 — mediaProfiles is a single
    // top-level collection now, so every scope (City/District/State/
    // Country/All) is just a plain query against it, filtered by whichever
    // field matches the chosen scope. No more collectionGroup queries at
    // all, which also means no more composite-index requirement for these —
    // Firestore auto-indexes single-field equality queries on a plain
    // collection by default.
    if(scopeLevel==='all'){
      q = db.collection('mediaProfiles').limit(PAGE_SIZE);
    } else if(scopeLevel==='city'){
      q = db.collection('mediaProfiles').where('homeCity','==',scopeValue).limit(PAGE_SIZE);
    } else {
      // district / state / country
      q = db.collection('mediaProfiles').where(scopeLevel,'==',scopeValue).limit(PAGE_SIZE);
    }
    if(!reset && lastDoc) q = q.startAfter(lastDoc);
    var snap = await q.get();
    if(reset) list.innerHTML='';
    if(!snap.docs.length && reset){
      list.innerHTML = '<div class="dp-empty">এই scope-এ এখনও কোনো creator/seller নেই।<br>DELTA যত নতুন city/district-এ ছড়াবে, এখানে তত বেশি দেখা যাবে।</div>';
      loadMoreBtn.style.display='none';
      return;
    }
    lastDoc = snap.docs[snap.docs.length-1] || null;
    var items = snap.docs.map(function(d){ var p=d.data(); p.id=d.id; return p; });
    renderAllCreatorCards(items, list);
    loadMoreBtn.style.display = snap.docs.length===PAGE_SIZE ? 'block' : 'none';
  }catch(e){
    console.warn('All Creators load error', e);
    list.innerHTML = '<div class="dp-empty">লোড করতে সমস্যা হয়েছে। একটু পরে আবার চেষ্টা করুন।</div>';
    loadMoreBtn.style.display='none';
  }
}
// Informational only — Location Architecture v1, Section 7.1. Discovery never
// hides or filters a creator based on their city's delivery status; this is
// purely a transparency badge next to their location.
function cmDeliveryBadgeHtml(cityId){
  var cfg = ALL_CITY_CONFIGS[cityId];
  var entry = cfg && cfg.services && cfg.services.marketplaceDelivery;
  var status = entry ? entry.status : 'disabled';
  var meta = {
    active:       {label:'✅ Delivery Active',  color:'#1a7a4c'},
    coming_soon:  {label:'🕓 Delivery Coming Soon', color:'#B8925A'},
    maintenance:  {label:'🔧 Delivery Paused (Maintenance)', color:'#c77d1e'},
    paused:       {label:'⏸ Delivery Paused', color:'#8A8F98'},
    disabled:     {label:'🔸 Delivery Not Yet Here', color:'#8A8F98'}
  }[status] || {label:'', color:'#8A8F98'};
  if(!meta.label) return '';
  return '<span style="font-size:.62rem;font-weight:700;color:'+meta.color+';margin-left:6px;">'+meta.label+'</span>';
}
function renderAllCreatorCards(items, list){
  items.forEach(function(p){
    var card = document.createElement('div'); card.className='dp-card';
    var roleLabel = (p.roles||[]).indexOf('seller')>=0 ? 'Seller' : (p.primaryBadge==='service_provider' ? 'Service Provider' : 'Creator');
    var locLabel = [p.city, p.district].filter(Boolean).join(', ');
    var badge = p.city ? cmDeliveryBadgeHtml(p.city) : '';
    card.innerHTML =
      '<div class="dp-avatar-wrap">'+dpAvatarOrLetter(p.avatarUrl, p.displayName)+'</div>'+
      '<div class="dp-info"><div class="dp-name">'+(p.displayName||'Unknown')+' <span style="font-size:.68rem;color:var(--muted);font-weight:600;">· '+roleLabel+'</span></div>'+
      '<div class="dp-sub">'+(locLabel||'')+badge+'</div></div>'+
      '<button class="dp-follow-btn">Follow</button>';
    var btn = card.querySelector('.dp-follow-btn');
    var info = card.querySelector('.dp-info');
    info.onclick = function(){ location.href='media-profile.html?uid='+p.id+'&city='+(p.city||CITY); };
    btn.onclick = function(e){
      e.stopPropagation();
      if(!currentUser){ requireLogin(); return; }
      toggleFollow(p.id, btn, p.city);
    };
    list.appendChild(card);
  });
  dpBindAvatarFallbacks(list);
}

async function loadFollowList(reset){
  var list = document.getElementById('dpList');
  var loadMoreBtn = document.getElementById('dpLoadMore');
  try{
    if(currentUser && !followSet.length){
      var fs = await db.collection('mediaProfiles').doc(currentUser.uid).collection('following').get();
      followSet = fs.docs.map(function(d){return d.id;});
    }
    var q = db.collection('mediaProfiles').where('homeCity','==',CITY).limit(PAGE_SIZE);
    if(!reset && lastDoc) q = q.startAfter(lastDoc);
    var snap = await q.get();
    var docs = snap.docs.filter(function(d){ return d.id!==(currentUser&&currentUser.uid) && followSet.indexOf(d.id)===-1; });
    if(reset) list.innerHTML='';
    if(!docs.length && reset){
      renderFollowCards(DEMO_FOLLOW, true, list);
      loadMoreBtn.style.display='none';
      return;
    }
    lastDoc = snap.docs[snap.docs.length-1] || null;
    renderFollowCards(docs.map(function(d){ var p=d.data(); p.id=d.id; return p; }), false, list);
    loadMoreBtn.style.display = snap.docs.length===PAGE_SIZE ? 'block' : 'none';
  }catch(e){
    console.warn('Discover People — follow list error', e);
    list.innerHTML='';
    renderFollowCards(DEMO_FOLLOW, true, list);
    loadMoreBtn.style.display='none';
  }
}

function renderFollowCards(items, isDemo, list){
  if(!items.length){ list.innerHTML='<div class="dp-empty">আপাতত নতুন কেউ নেই follow করার জন্য।</div>'; return; }
  items.forEach(function(p){
    var card = document.createElement('div'); card.className='dp-card';
    card.innerHTML =
      '<div class="dp-avatar-wrap">'+dpAvatarOrLetter(p.avatarUrl, p.displayName)+'</div>'+
      '<div class="dp-info"><div class="dp-name">'+(p.displayName||'Unknown')+'</div><div class="dp-sub">@'+(p.username||'user')+'</div></div>'+
      '<button class="dp-follow-btn">Follow</button>';
    var btn = card.querySelector('.dp-follow-btn');
    var info = card.querySelector('.dp-info');
    if(isDemo){
      card.onclick = function(){ alert('Demo suggestion — becomes real once actual creators sign up'); };
    } else {
      info.onclick = function(){ location.href='media-profile.html?uid='+p.id; };
      btn.onclick = function(e){
        e.stopPropagation();
        if(!currentUser){ requireLogin(); return; }
        toggleFollow(p.id, btn);
      };
    }
    list.appendChild(card);
  });
  dpBindAvatarFallbacks(list);
}

async function loadTopList(reset){
  var list = document.getElementById('dpList');
  var loadMoreBtn = document.getElementById('dpLoadMore');
  try{
    var q = db.collection('mediaProfiles').where('homeCity','==',CITY).limit(PAGE_SIZE);
    if(!reset && lastDoc) q = q.startAfter(lastDoc);
    var snap = await q.get();
    var withCounts = await Promise.all(snap.docs.map(async function(doc){
      var followers = await doc.ref.collection('followers').get();
      return {id:doc.id, data:doc.data(), count:followers.size};
    }));
    withCounts.sort(function(a,b){ return b.count - a.count; });
    if(reset) list.innerHTML='';
    var useDemo = reset && (!withCounts.length || withCounts[0].count===0);
    if(useDemo){
      renderTopCards(DEMO_TOP, true, list, 0);
      loadMoreBtn.style.display='none';
      return;
    }
    lastDoc = snap.docs[snap.docs.length-1] || null;
    renderTopCards(withCounts, false, list, list.children.length);
    loadMoreBtn.style.display = snap.docs.length===PAGE_SIZE ? 'block' : 'none';
  }catch(e){
    console.warn('Discover People — top list error', e);
    list.innerHTML='';
    renderTopCards(DEMO_TOP, true, list, 0);
    loadMoreBtn.style.display='none';
  }
}

function renderTopCards(items, isDemo, list, startRank){
  if(!items.length){ list.innerHTML='<div class="dp-empty">এখনও কোনো ranked creator নেই।</div>'; return; }
  items.forEach(function(item, i){
    var name = isDemo ? item.displayName : (item.data.displayName||'Unknown');
    var avatar = isDemo ? item.avatarUrl : (item.data.avatarUrl||'');
    var count = isDemo ? item.count : (item.count+'');
    var card = document.createElement('div'); card.className='dp-card';
    card.innerHTML =
      '<div class="dp-avatar-wrap"><div class="dp-rank">'+(startRank+i+1)+'</div>'+dpAvatarOrLetter(avatar, name)+'</div>'+
      '<div class="dp-info"><div class="dp-name">'+name+'</div><div class="dp-sub">'+count+' Followers</div></div>'+
      '<button class="dp-follow-btn">Follow</button>';
    var btn = card.querySelector('.dp-follow-btn');
    var info = card.querySelector('.dp-info');
    if(isDemo){
      card.onclick = function(){ alert('Demo entry — becomes real once creators build a real following'); };
    } else {
      info.onclick = function(){ location.href='media-profile.html?uid='+item.id+'&city='+CITY; };
      btn.onclick = function(e){
        e.stopPropagation();
        if(!currentUser){ requireLogin(); return; }
        toggleFollow(item.id, btn);
      };
    }
    list.appendChild(card);
  });
  dpBindAvatarFallbacks(list);
}

function toggleFollow(targetUid, btn){
  var myRef = db.collection('mediaProfiles').doc(currentUser.uid).collection('following').doc(targetUid);
  var theirRef = db.collection('mediaProfiles').doc(targetUid).collection('followers').doc(currentUser.uid);
  var isFollowing = btn.classList.contains('following');
  if(isFollowing){
    myRef.delete(); theirRef.delete();
    btn.textContent='Follow'; btn.classList.remove('following');
  } else {
    myRef.set({followedAt:new Date().toISOString()});
    theirRef.set({followedAt:new Date().toISOString()});
    btn.textContent='Following'; btn.classList.add('following');
  }
}

var DEMO_REELS = [
  {thumb:'https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=300&q=60', views:'12.5K'},
  {thumb:'https://images.unsplash.com/photo-1567337710282-00832b415979?w=300&q=60', views:'9.8K'},
  {thumb:'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=300&q=60', views:'8.1K'},
  {thumb:'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=300&q=60', views:'6.4K'},
];
async function loadReelsList(reset){
  var list = document.getElementById('dpList');
  var loadMoreBtn = document.getElementById('dpLoadMore');
  try{
    var q = db.collection('cities').doc(CITY).collection('mediaContent')
      .where('type','==','reel').where('status','==','published').orderBy('createdAt','desc').limit(PAGE_SIZE);
    if(!reset && lastDoc) q = q.startAfter(lastDoc);
    var snap = await q.get();
    if(reset) list.innerHTML='';
    if(!snap.docs.length && reset){
      renderReelCards(DEMO_REELS, true, list);
      loadMoreBtn.style.display='none';
      return;
    }
    lastDoc = snap.docs[snap.docs.length-1] || null;
    var items = snap.docs.map(function(d){ return d.data(); });
    renderReelCards(items, false, list);
    loadMoreBtn.style.display = snap.docs.length===PAGE_SIZE ? 'block' : 'none';
  }catch(e){
    // Likely missing Firestore composite index (type + status + orderBy) —
    // same known gap as the Discover row. Fall back to demo cards.
    console.warn('Discover People — reels list error (likely missing composite index)', e);
    list.innerHTML='';
    renderReelCards(DEMO_REELS, true, list);
    loadMoreBtn.style.display='none';
  }
}
function renderReelCards(items, isDemo, list){
  if(!items.length){ list.innerHTML='<div class="dp-empty">এখনও কোনো Reel নেই।</div>'; return; }
  items.forEach(function(d){
    var thumb = isDemo ? d.thumb : (d.thumbnailUrl||'');
    var views = isDemo ? d.views : ((d.stats&&d.stats.views)||0);
    var card = document.createElement('div'); card.className='dp-reel-card';
    card.innerHTML = '<img src="'+thumb+'" onerror="this.style.background=\'var(--cream)\'"><div class="dp-reel-views">▶ '+views+'</div>';
    card.onclick = isDemo
      ? function(){ alert('Demo thumbnail — becomes a real reel once creators start posting'); }
      : function(){ location.href='reels-player.html?city='+CITY; };
    list.appendChild(card);
  });
}

function loadMore(){
  if(activeTab==='follow') loadFollowList(false);
  else if(activeTab==='top') loadTopList(false);
  else if(activeTab==='reels') loadReelsList(false);
  else loadAllCreators(false);
}

// Where THIS logged-in account's own profile actually lives (or, for an
// unassigned account, their real geocoded district/state) — used to default
// the scope selector to something that's actually THEIRS, rather than
// falling back to a generic city (e.g. Manteswar) they have no connection
// to just because a formal DELTA city doesn't exist for them yet.
async function loadMyScopeDefault(uid){
  try{
    var doc = await db.collection('mediaProfiles').doc(uid).get();
    if(!doc.exists) return null;
    var d = doc.data();
    if(d.homeCity) return {level:'city', value:d.homeCity};
    // No real city — but the district/state they were geocoded into at
    // registration IS real, and is a far more honest default than
    // Manteswar. City scope itself has no meaningful value for them
    // (homeCity is null), so scope one level up.
    if(d.district) return {level:'district', value:d.district};
    if(d.state) return {level:'state', value:d.state};
    return null; // nothing geocoded — genuinely nothing to default to
  }catch(e){ console.warn('loadMyScopeDefault failed (non-fatal)', e); return null; }
}

auth.onAuthStateChanged(async function(u){
  currentUser = u;
  followSet = [];
  document.getElementById('tabFollow').classList.toggle('active', activeTab==='follow');
  document.getElementById('tabTop').classList.toggle('active', activeTab==='top');
  document.getElementById('tabReels').classList.toggle('active', activeTab==='reels');
  document.getElementById('tabAll').classList.toggle('active', activeTab==='all');
  document.getElementById('dpScopeRow').style.display = activeTab==='all' ? 'flex' : 'none';
  document.getElementById('dpList').className = activeTab==='reels' ? 'dp-reel-grid' : 'dp-list';
  if(activeTab==='follow') loadFollowList(true);
  else if(activeTab==='top') loadTopList(true);
  else if(activeTab==='reels') loadReelsList(true);
  else {
    await loadAllCityConfigs();
    if(u && scopeLevel==='city'){
      var myDefault = await loadMyScopeDefault(u.uid);
      if(myDefault){ scopeLevel = myDefault.level; scopeValue = myDefault.value; }
    }
    renderScopePills(); renderScopeValueSelect(); loadAllCreators(true);
  }
});
