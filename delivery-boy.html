<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DELTA — Delivery Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --navy:#0a1f35;--navy2:#122840;--navy3:#061526;
  --orange:#f07018;--orange2:#ff8c3a;--orange-light:#fff4ec;
  --white:#fff;--cream:#f7f9fc;--sand:#eef2f7;
  --border:#dde5ef;--muted:#6b7b8d;--charcoal:#1a2535;
  --green:#1a8a4a;--green2:#e8f7ef;--red:#c0392b;--red2:#ffeaea;
  --yellow:#f39c12;--yellow2:#fff8e8;--blue:#0984e3;--blue2:#e8f4ff;
}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--charcoal);}
button,input,select{font-family:'DM Sans',sans-serif;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:#c0cdd8;border-radius:3px;}

/* ── AUTH ── */
#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--navy3),var(--navy),#1a3050);padding:20px;}
.auth-box{background:#fff;border-radius:22px;padding:36px;width:100%;max-width:400px;
  box-shadow:0 24px 70px rgba(0,0,0,.3);}
.auth-logo{text-align:center;margin-bottom:24px;}
.auth-logo h1{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:900;
  color:var(--navy);letter-spacing:2px;}
.auth-logo h1 em{color:var(--orange);font-style:normal;}
.auth-logo p{font-size:.78rem;color:var(--muted);margin-top:4px;}
.form-group{margin-bottom:13px;}
.form-group label{display:block;font-size:.72rem;font-weight:700;color:var(--muted);
  margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
.form-input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:9px;
  font-size:.875rem;outline:none;transition:border-color .2s;background:var(--cream);}
.form-input:focus{border-color:var(--orange);background:#fff;}
.btn-primary{width:100%;padding:13px;background:var(--orange);color:#fff;border:none;
  border-radius:10px;font-size:.92rem;font-weight:700;cursor:pointer;transition:all .2s;margin-top:4px;}
.btn-primary:hover{background:var(--orange2);}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;}
.auth-err{background:var(--red2);color:var(--red);padding:9px 13px;border-radius:8px;
  font-size:.8rem;margin-bottom:12px;display:none;}

/* ── APP ── */
#appScreen{display:none;min-height:100vh;}
.topbar{background:var(--navy);padding:0 20px;height:60px;display:flex;
  align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;
  box-shadow:0 2px 12px rgba(0,0,0,.15);}
.tb-logo{display:flex;align-items:center;gap:10px;}
.tb-logo-mark{width:34px;height:34px;background:var(--orange);border-radius:9px;
  display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;
  font-weight:900;color:#fff;font-size:.9rem;flex-shrink:0;}
.tb-logo-text{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:900;
  color:#fff;letter-spacing:1px;}
.tb-logo-text em{color:var(--orange);font-style:normal;}
.tb-badge{background:rgba(26,138,74,.2);border:1px solid rgba(26,138,74,.4);
  color:#55efc4;font-size:.68rem;font-weight:700;padding:3px 10px;border-radius:20px;
  margin-left:10px;}
.tb-right{display:flex;align-items:center;gap:12px;}
.tb-name{font-size:.78rem;color:rgba(255,255,255,.6);}
.logout-btn{background:rgba(192,57,43,.18);border:none;color:#ff8a80;padding:7px 14px;
  border-radius:8px;font-size:.78rem;font-weight:600;cursor:pointer;}
.logout-btn:hover{background:rgba(192,57,43,.32);}

.tabs{display:flex;gap:4px;padding:0 20px;background:#fff;
  border-bottom:1px solid var(--border);overflow-x:auto;}
.tab-btn{padding:14px 16px;border:none;background:transparent;cursor:pointer;
  font-size:.85rem;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;
  transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:7px;}
.tab-btn.active{color:var(--orange);border-bottom-color:var(--orange);}
.tab-count{background:var(--orange);color:#fff;font-size:.65rem;font-weight:800;
  padding:1px 7px;border-radius:10px;}
.tab-count.zero{background:var(--border);color:var(--muted);}

.content{padding:20px;max-width:700px;margin:0 auto;}
.page{display:none;}
.page.active{display:block;}

/* ── STATS ── */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
.stat-box{background:#fff;border-radius:14px;padding:16px;border:1px solid var(--border);
  text-align:center;}
.stat-box strong{display:block;font-size:1.5rem;font-weight:800;color:var(--navy);
  font-family:'Playfair Display',serif;}
.stat-box span{font-size:.72rem;color:var(--muted);margin-top:2px;display:block;}

/* ── ORDER CARDS ── */
.order-card{background:#fff;border-radius:16px;border:1px solid var(--border);
  padding:18px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.04);}
.order-card.oc-assigned{border-left:4px solid var(--blue);}
.order-card.oc-picked{border-left:4px solid var(--yellow);}
.order-card.oc-on-way{border-left:4px solid var(--orange);}
.order-card.oc-delivered{border-left:4px solid var(--green);}
.oc-top{display:flex;justify-content:space-between;align-items:flex-start;
  margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.oc-id{font-size:.78rem;font-weight:700;color:var(--orange);}
.oc-shop{font-size:.92rem;font-weight:700;color:var(--charcoal);margin-top:2px;}
.oc-status-pill{font-size:.68rem;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;}
.pill-assigned{background:var(--blue2);color:var(--blue);}
.pill-picked{background:var(--yellow2);color:#7d5a00;}
.pill-on-way{background:var(--orange-light);color:var(--orange);}
.pill-delivered{background:var(--green2);color:var(--green);}

.addr-block{background:var(--sand);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
.addr-row{display:flex;gap:10px;align-items:flex-start;font-size:.82rem;margin-bottom:6px;}
.addr-row:last-child{margin-bottom:0;}
.addr-icon{font-size:1rem;flex-shrink:0;margin-top:1px;}
.addr-label{font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.5px;display:block;margin-bottom:2px;}
.addr-text{color:var(--charcoal);font-weight:500;}
.addr-phone{color:var(--blue);font-weight:700;text-decoration:none;}
.addr-phone:hover{text-decoration:underline;}

.amount-row{display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-top:1px solid var(--border);margin-top:8px;}
.amount-val{font-size:1rem;font-weight:800;color:var(--navy);}
.payment-tag{font-size:.72rem;font-weight:600;padding:3px 8px;border-radius:8px;
  background:var(--sand);color:var(--muted);}

.oc-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.btn-sm{padding:9px 18px;border-radius:9px;font-size:.82rem;font-weight:700;cursor:pointer;
  border:none;transition:all .2s;display:inline-flex;align-items:center;gap:6px;}
.btn-blue{background:var(--blue2);color:var(--blue);}
.btn-blue:hover{background:var(--blue);color:#fff;}
.btn-orange{background:var(--orange-light);color:var(--orange);}
.btn-orange:hover{background:var(--orange);color:#fff;}
.btn-green{background:var(--green2);color:var(--green);}
.btn-green:hover{background:var(--green);color:#fff;}

.empty-state{text-align:center;padding:52px 20px;background:#fff;
  border-radius:16px;border:2px dashed var(--border);}
.empty-icon{font-size:2.6rem;margin-bottom:12px;}
.empty-state p{color:var(--muted);font-size:.88rem;}

/* ── EARNINGS ── */
.earnings-card{background:linear-gradient(135deg,var(--navy3),var(--navy));
  border-radius:18px;padding:22px;color:#fff;margin-bottom:16px;}
.ec-label{font-size:.72rem;color:rgba(255,255,255,.45);text-transform:uppercase;
  letter-spacing:1.5px;margin-bottom:4px;}
.ec-value{font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;color:var(--orange2);}
.ec-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
.ec-box{background:rgba(255,255,255,.07);border-radius:10px;padding:12px;}
.ec-box-label{font-size:.68rem;color:rgba(255,255,255,.4);margin-bottom:4px;}
.ec-box-val{font-size:1.1rem;font-weight:700;color:#fff;}

.delivery-row{display:flex;justify-content:space-between;align-items:center;
  padding:12px 0;border-bottom:1px solid var(--border);font-size:.82rem;}
.delivery-row:last-child{border-bottom:none;}

.loading-screen{position:fixed;inset:0;background:var(--navy3);display:flex;
  align-items:center;justify-content:center;z-index:1000;}
.loading-spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.15);
  border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:rgba(255,255,255,.5);font-size:.78rem;text-align:center;}

.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;
  padding:12px 18px;border-radius:12px;font-size:.82rem;font-weight:500;
  box-shadow:0 6px 24px rgba(0,0,0,.2);z-index:999;display:none;align-items:center;
  gap:10px;border-left:3px solid var(--orange);max-width:300px;}
.toast.show{display:flex;animation:toastIn .3s ease;}
.toast.green{border-left-color:var(--green);}
.toast.red{border-left-color:var(--red);}
@keyframes toastIn{from{transform:translateX(80px);opacity:0}to{transform:translateX(0);opacity:1}}

@media(max-width:480px){
  .stats-row{grid-template-columns:1fr 1fr;}
  .content{padding:14px;}
}
</style>
</head>
<body>

<div class="toast" id="toastEl"></div>

<div class="loading-screen" id="loadingScreen">
  <div>
    <div class="loading-spinner"></div>
    <div class="loading-text">DELTA Delivery Panel লোড হচ্ছে...</div>
  </div>
</div>

<!-- ═══ AUTH ═══ -->
<div id="authScreen" style="display:none">
  <div class="auth-box">
    <div class="auth-logo">
      <h1>△ DELT<em>A</em></h1>
      <p>Delivery Panel — শুধুমাত্র নিবন্ধিত Delivery Boy দের জন্য</p>
    </div>
    <div class="auth-err" id="loginErr"></div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" class="form-input" id="aEmail" placeholder="delivery@example.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" class="form-input" id="aPass" placeholder="••••••••">
    </div>
    <button class="btn-primary" id="loginBtn" onclick="doLogin()">🛵 লগইন করুন</button>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="appScreen">
  <header class="topbar">
    <div class="tb-logo">
      <div class="tb-logo-mark">D</div>
      <div class="tb-logo-text">DELT<em>A</em></div>
      <span class="tb-badge">🛵 DELIVERY</span>
    </div>
    <div class="tb-right">
      <span class="tb-name" id="dbNameLabel"></span>
      <button class="logout-btn" onclick="doLogout()">লগআউট</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" id="tab-active" onclick="goTab('active',this)">
      🛵 সক্রিয় অর্ডার <span class="tab-count zero" id="countActive">0</span>
    </button>
    <button class="tab-btn" id="tab-history" onclick="goTab('history',this)">
      📦 ইতিহাস
    </button>
    <button class="tab-btn" id="tab-earnings" onclick="goTab('earnings',this)">
      💰 আয়
    </button>
  </nav>

  <div class="content">

    <!-- ═══ ACTIVE ORDERS ═══ -->
    <div class="page active" id="page-active">
      <div id="activeOrdersWrap"></div>
    </div>

    <!-- ═══ HISTORY ═══ -->
    <div class="page" id="page-history">
      <div class="stats-row">
        <div class="stat-box"><strong id="statTotal">0</strong><span>মোট ডেলিভারি</span></div>
        <div class="stat-box"><strong id="statToday">0</strong><span>আজকে</span></div>
        <div class="stat-box"><strong id="statEarned">₹0</strong><span>মোট আয়</span></div>
      </div>
      <div id="historyWrap"></div>
    </div>

    <!-- ═══ EARNINGS ═══ -->
    <div class="page" id="page-earnings">
      <div class="earnings-card">
        <div class="ec-label">এই মাসের আয়</div>
        <div class="ec-value" id="earningsMonth">₹0</div>
        <div class="ec-grid">
          <div class="ec-box">
            <div class="ec-box-label">মোট ডেলিভারি</div>
            <div class="ec-box-val" id="earningsTotalDel">0</div>
          </div>
          <div class="ec-box">
            <div class="ec-box-label">গড় প্রতি ডেলিভারি</div>
            <div class="ec-box-val" id="earningsAvg">₹0</div>
          </div>
        </div>
      </div>
      <div style="background:#fff;border-radius:14px;border:1px solid var(--border);padding:16px">
        <div style="font-size:.88rem;font-weight:700;color:var(--navy);margin-bottom:14px">
          📋 সাম্প্রতিক ডেলিভারি
        </div>
        <div id="earningsListWrap"></div>
      </div>
    </div>

  </div>
</div>

<script>
var FB_CFG = {
  apiKey:"AIzaSyA6TrrnCMwv1aa1WPqGvTVWlnieB2pVOEU",
  authDomain:"delta-platform-82fc0.firebaseapp.com",
  projectId:"delta-platform-82fc0",
  storageBucket:"delta-platform-82fc0.firebasestorage.app",
  messagingSenderId:"444904180433",
  appId:"1:444904180433:web:6706eba4d73a30cd67d3f0"
};
var CITY = 'manteswar';
var DELIVERY_FEE_PER_ORDER = 30; // ৳30 per delivery as default earnings
var auth, db, CU = null, DBProfile = null;
var myOrders = [];

(function(){
  var scripts=[
    'https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js',
    'https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js',
    'https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js'
  ];
  var n=0, done=false, hadErr=false;
  function tryInit(){
    if(done)return; done=true;
    if(hadErr||typeof firebase==='undefined'){
      hideLoading(); showAuth();
      showToast('Internet সংযোগ সমস্যা — Page reload করুন','red');
      return;
    }
    initFirebase();
  }
  scripts.forEach(function(src){
    var s=document.createElement('script'); s.src=src;
    s.onload=function(){ if(++n===scripts.length) tryInit(); };
    s.onerror=function(){ hadErr=true; if(++n===scripts.length) tryInit(); };
    document.head.appendChild(s);
  });
  setTimeout(tryInit, 8000);
})();

function initFirebase(){
  try{
    firebase.initializeApp(FB_CFG);
    auth=firebase.auth(); db=firebase.firestore();
    auth.onAuthStateChanged(function(u){
      if(u){
        // Check deliveryBoys collection to verify this is a registered delivery boy
        db.collection('deliveryBoys').doc(u.uid).get().then(function(doc){
          if(doc.exists){
            CU=u; DBProfile=doc.data();
            document.getElementById('dbNameLabel').textContent = DBProfile.name||u.email;
            hideLoading(); showApp();
            loadAllOrders();
          } else {
            auth.signOut();
            hideLoading(); showAuth();
            var err=document.getElementById('loginErr');
            err.textContent='এই account-এর Delivery Panel access নেই।';
            err.style.display='block';
          }
        }).catch(function(){
          auth.signOut(); hideLoading(); showAuth();
        });
      } else {
        hideLoading(); showAuth();
      }
    });
  }catch(e){ hideLoading(); showAuth(); }
}

function hideLoading(){ document.getElementById('loadingScreen').style.display='none'; }
function showAuth(){ document.getElementById('authScreen').style.display='flex'; document.getElementById('appScreen').style.display='none'; }
function showApp(){ document.getElementById('authScreen').style.display='none'; document.getElementById('appScreen').style.display='block'; }
function showToast(msg,type){
  var e=document.getElementById('toastEl'); e.textContent=msg;
  e.className='toast show '+(type||''); clearTimeout(e._t);
  e._t=setTimeout(function(){e.className='toast';},3200);
}

function doLogin(){
  var e=document.getElementById('aEmail').value.trim();
  var p=document.getElementById('aPass').value;
  var err=document.getElementById('loginErr'); err.style.display='none';
  if(!e||!p){err.textContent='Email ও Password দিন।';err.style.display='block';return;}
  var btn=document.getElementById('loginBtn'); btn.disabled=true; btn.textContent='লগইন হচ্ছে...';
  auth.signInWithEmailAndPassword(e,p).catch(function(er){
    var msgs={
      'auth/user-not-found':'Account পাওয়া যায়নি',
      'auth/wrong-password':'পাসওয়ার্ড ভুল',
      'auth/invalid-credential':'Email বা পাসওয়ার্ড ভুল'
    };
    err.textContent=msgs[er.code]||er.message; err.style.display='block';
    btn.disabled=false; btn.textContent='🛵 লগইন করুন';
  }).then(function(){
    btn.disabled=false; btn.textContent='🛵 লগইন করুন';
  });
}

function doLogout(){
  if(!confirm('লগআউট করবেন?'))return;
  auth.signOut();
}

function goTab(tab, btn){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  document.getElementById('page-'+tab).classList.add('active');
  btn.classList.add('active');
  if(tab==='earnings') renderEarnings();
}

// ═══ LOAD ALL ASSIGNED ORDERS (across all sellers in the city) ═══
function loadAllOrders(){
  myOrders = [];
  db.collection('cities').doc(CITY).collection('sellers').get().then(function(snap){
    var sellers = [];
    snap.forEach(function(d){ sellers.push(d.id); });
    var proms = sellers.map(function(sid){
      return db.collection('cities').doc(CITY).collection('sellers').doc(sid)
        .collection('orders')
        .where('deliveryBoyId','==',CU.uid)
        .get().then(function(oSnap){
          oSnap.forEach(function(d){
            myOrders.push(Object.assign({id:d.id, shopId:sid}, d.data()));
          });
        }).catch(function(){});
    });
    Promise.all(proms).then(function(){
      myOrders.sort(function(a,b){ return new Date(b.createdAt||0)-new Date(a.createdAt||0); });
      renderActiveOrders();
      renderHistory();
      renderEarnings();
      updateCounts();
      startOrderListener(sellers);
    });
  }).catch(function(e){ showToast('লোড সমস্যা: '+e.message,'red'); });
}

// Real-time listener for newly assigned orders
function startOrderListener(sellerIds){
  sellerIds.forEach(function(sid){
    db.collection('cities').doc(CITY).collection('sellers').doc(sid)
      .collection('orders')
      .where('deliveryBoyId','==',CU.uid)
      .onSnapshot(function(snap){
        snap.docChanges().forEach(function(change){
          var o = Object.assign({id:change.doc.id, shopId:sid}, change.doc.data());
          if(change.type==='added'){
            var exists = myOrders.some(function(x){return x.id===o.id&&x.shopId===sid;});
            if(!exists){
              myOrders.unshift(o);
              showToast('🛵 নতুন ডেলিভারি assign হয়েছে!','green');
            }
          } else if(change.type==='modified'){
            var idx=myOrders.findIndex(function(x){return x.id===o.id&&x.shopId===sid;});
            if(idx>=0) myOrders[idx]=o; else myOrders.unshift(o);
          } else if(change.type==='removed'){
            myOrders=myOrders.filter(function(x){return !(x.id===o.id&&x.shopId===sid);});
          }
          renderActiveOrders(); renderHistory(); updateCounts();
        });
      });
  });
}

function updateCounts(){
  var active = myOrders.filter(function(o){
    return o.deliveryStatus!=='delivered' && o.deliveryStatus!=='cancelled';
  });
  document.getElementById('countActive').textContent = active.length;
  document.getElementById('countActive').classList.toggle('zero', active.length===0);
}

var DB_STATUS_MAP = {
  assigned:  {label:'📋 Assigned',    pill:'pill-assigned', cls:'oc-assigned'},
  picked_up: {label:'📦 Picked Up',   pill:'pill-picked',   cls:'oc-picked'},
  on_the_way:{label:'🛵 On the Way',  pill:'pill-on-way',   cls:'oc-on-way'},
  delivered: {label:'✅ Delivered',   pill:'pill-delivered', cls:'oc-delivered'}
};

function orderCardHTML(o, showActions){
  var ds = o.deliveryStatus||'assigned';
  var sm = DB_STATUS_MAP[ds]||DB_STATUS_MAP.assigned;
  var time = o.createdAt ? new Date(o.createdAt).toLocaleDateString('bn-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '—';
  var actionBtns = '';
  if(showActions){
    if(ds==='assigned')
      actionBtns='<button class="btn-sm btn-blue" onclick="updateDeliveryStatus(\''+o.shopId+'\',\''+o.id+'\',\'picked_up\')">📦 Picked Up করুন</button>';
    else if(ds==='picked_up')
      actionBtns='<button class="btn-sm btn-orange" onclick="updateDeliveryStatus(\''+o.shopId+'\',\''+o.id+'\',\'on_the_way\')">🛵 On the Way</button>';
    else if(ds==='on_the_way')
      actionBtns='<button class="btn-sm btn-green" onclick="updateDeliveryStatus(\''+o.shopId+'\',\''+o.id+'\',\'delivered\')">✅ Delivered করুন</button>';
  }
  return '<div class="order-card '+sm.cls+'">'+
    '<div class="oc-top">'+
      '<div><div class="oc-id">#'+o.id.slice(-6).toUpperCase()+'</div>'+
      '<div class="oc-shop">🏪 '+(o.shopName||'—')+'</div></div>'+
      '<span class="oc-status-pill '+sm.pill+'">'+sm.label+'</span>'+
    '</div>'+
    '<div class="addr-block">'+
      '<div class="addr-row">'+
        '<span class="addr-icon">📍</span>'+
        '<div><span class="addr-label">Pickup (দোকান)</span>'+
        '<span class="addr-text">'+(o.shopAddress||o.shopName||'দোকানের ঠিকানা নেই')+'</span></div>'+
      '</div>'+
      '<div class="addr-row">'+
        '<span class="addr-icon">🏠</span>'+
        '<div><span class="addr-label">Delivery (গ্রাহক)</span>'+
        '<span class="addr-text">'+(o.deliveryAddress||'ঠিকানা নেই')+'</span></div>'+
      '</div>'+
      '<div class="addr-row">'+
        '<span class="addr-icon">📞</span>'+
        '<div><span class="addr-label">গ্রাহকের Phone</span>'+
        '<a class="addr-phone" href="tel:'+(o.customerPhone||'')+'">'+(o.customerPhone||o.customerName||'—')+'</a></div>'+
      '</div>'+
    '</div>'+
    '<div class="amount-row">'+
      '<span class="payment-tag">'+(o.paymentMethod==='cod'?'💵 Cash on Delivery':'💳 UPI')+'</span>'+
      '<span class="amount-val">₹'+(o.total||0)+'</span>'+
    '</div>'+
    (actionBtns?'<div class="oc-actions">'+actionBtns+'</div>':'')+
  '</div>';
}

function renderActiveOrders(){
  var wrap = document.getElementById('activeOrdersWrap');
  var active = myOrders.filter(function(o){
    return o.deliveryStatus!=='delivered';
  });
  if(!active.length){
    wrap.innerHTML='<div class="empty-state"><div class="empty-icon">🛵</div>'+
      '<p>এখন কোনো active ডেলিভারি নেই</p></div>';
    return;
  }
  wrap.innerHTML = active.map(function(o){return orderCardHTML(o,true);}).join('');
}

function renderHistory(){
  var wrap = document.getElementById('historyWrap');
  var delivered = myOrders.filter(function(o){ return o.deliveryStatus==='delivered'; });
  var todayStr = new Date().toDateString();
  var todayCount = delivered.filter(function(o){
    return o.deliveryCompletedAt && new Date(o.deliveryCompletedAt).toDateString()===todayStr;
  }).length;
  var totalEarned = delivered.length * DELIVERY_FEE_PER_ORDER;
  document.getElementById('statTotal').textContent = delivered.length;
  document.getElementById('statToday').textContent = todayCount;
  document.getElementById('statEarned').textContent = '₹'+totalEarned;
  if(!delivered.length){
    wrap.innerHTML='<div class="empty-state"><div class="empty-icon">📦</div>'+
      '<p>এখনো কোনো ডেলিভারি সম্পন্ন হয়নি</p></div>';
    return;
  }
  wrap.innerHTML = delivered.map(function(o){return orderCardHTML(o,false);}).join('');
}

function renderEarnings(){
  var delivered = myOrders.filter(function(o){return o.deliveryStatus==='delivered';});
  var now = new Date();
  var thisMonth = delivered.filter(function(o){
    if(!o.deliveryCompletedAt) return false;
    var d = new Date(o.deliveryCompletedAt);
    return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  });
  var monthEarnings = thisMonth.length * DELIVERY_FEE_PER_ORDER;
  var avg = delivered.length ? Math.round((delivered.length*DELIVERY_FEE_PER_ORDER)/delivered.length) : 0;
  document.getElementById('earningsMonth').textContent = '₹'+monthEarnings;
  document.getElementById('earningsTotalDel').textContent = delivered.length;
  document.getElementById('earningsAvg').textContent = '₹'+avg;
  var listWrap = document.getElementById('earningsListWrap');
  var recent = delivered.slice(0,10);
  if(!recent.length){
    listWrap.innerHTML='<div style="text-align:center;padding:20px;color:var(--muted);font-size:.85rem">এখনো কোনো আয় নেই</div>';
    return;
  }
  listWrap.innerHTML = recent.map(function(o){
    var t = o.deliveryCompletedAt ? new Date(o.deliveryCompletedAt).toLocaleDateString('bn-IN',{day:'numeric',month:'short'}) : '—';
    return '<div class="delivery-row">'+
      '<div><strong>#'+o.id.slice(-6).toUpperCase()+'</strong> — '+(o.shopName||'—')+'<br>'+
      '<span style="font-size:.72rem;color:var(--muted)">'+t+'</span></div>'+
      '<strong style="color:var(--green)">₹'+DELIVERY_FEE_PER_ORDER+'</strong>'+
    '</div>';
  }).join('');
}

function updateDeliveryStatus(shopId, orderId, newStatus){
  var statusLabels = {
    picked_up:'Picked Up', on_the_way:'On the Way', delivered:'Delivered'
  };
  var updates = {
    deliveryStatus: newStatus,
    deliveryUpdatedAt: new Date().toISOString()
  };
  // When delivered, also update the main order status and record completion time
  if(newStatus==='delivered'){
    updates.status = 'delivered';
    updates.deliveryCompletedAt = new Date().toISOString();
  }
  db.collection('cities').doc(CITY).collection('sellers').doc(shopId)
    .collection('orders').doc(orderId).update(updates)
    .then(function(){
      var o = myOrders.find(function(x){return x.id===orderId&&x.shopId===shopId;});
      if(o){ Object.assign(o, updates); }
      renderActiveOrders(); renderHistory(); updateCounts();
      showToast('Status আপডেট হয়েছে: '+statusLabels[newStatus]+' ✅','green');
    }).catch(function(e){
      showToast('আপডেট ব্যর্থ: '+e.message,'red');
    });
}
</script>
