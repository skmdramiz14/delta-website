<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DELTA Videos</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{overflow-x:hidden;max-width:100vw;}
:root{
  --navy:#10392D;--navy2:#1a4a3a;--orange:#C7A15A;--orange-dark:#b8925a;--orange-light:#F3EFE6;
  --white:#fff;--cream:#F7F8FA;--border:#E7E9EC;--muted:#8A8F98;--charcoal:#1A1A1A;
}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--charcoal);padding-bottom:64px;}

/* ── TOP BAR — logo, notifications, search ── */
.vh-topbar{background:var(--white);padding:12px 16px;display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:200;border-bottom:1px solid var(--border);}
.vh-logo{font-family:'Playfair Display',serif;font-weight:900;font-size:1.3rem;color:var(--navy);
  display:flex;align-items:center;gap:6px;flex:1;cursor:pointer;white-space:nowrap;}
.vh-logo-mark{color:var(--orange);}
.vh-logo em{color:var(--orange);font-style:normal;}
.vh-topbar-btn{background:none;border:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;cursor:pointer;color:var(--navy);flex-shrink:0;position:relative;}
.vh-topbar-btn:active{background:var(--cream);}
.vh-notif-dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:#e0245e;
  border:1.5px solid #fff;}
.vh-search-expand{display:flex;align-items:center;background:var(--cream);border:1.5px solid var(--border);
  border-radius:22px;padding:0 6px 0 14px;flex:1;max-width:0;overflow:hidden;transition:max-width .22s ease;}
.vh-search-expand.open{max-width:320px;margin-left:2px;}
.vh-search-expand input{border:none;background:none;outline:none;flex:1;font-size:.85rem;padding:9px 0;
  font-family:'DM Sans',sans-serif;color:var(--charcoal);min-width:0;}
.vh-search-expand button{background:none;border:none;color:var(--muted);cursor:pointer;padding:6px;flex-shrink:0;}

/* ── MAIN TABS — হোম / ফলো / DELTA Official (this content model has no
   movies/TV catalog, so the third tab surfaces Admin/Official curated
   content instead — same structural role YouTube's "Movies & TV" plays
   (a distinct, curated-not-social pillar), adapted to what DELTA actually is) ── */
.vh-maintabs{display:flex;background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:61px;z-index:190;}
.vh-maintab{flex:1;text-align:center;padding:13px 4px 11px;font-size:.82rem;font-weight:700;color:var(--muted);
  cursor:pointer;border-bottom:2.5px solid transparent;}
.vh-maintab.active{color:var(--navy);border-bottom-color:var(--orange);}

.vh-filter-row{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;}
.vh-filter-row::-webkit-scrollbar{display:none;}
.vh-chip{flex-shrink:0;padding:7px 16px;border-radius:20px;font-size:.78rem;font-weight:700;
  background:var(--white);border:1.5px solid var(--border);color:var(--charcoal);cursor:pointer;white-space:nowrap;}
.vh-chip.active{background:var(--navy);border-color:var(--navy);color:#fff;}

/* ── BOTTOM NAV — fixed, 5 icons ── */
.vh-bottomnav{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--border);
  display:flex;align-items:center;z-index:250;padding-bottom:env(safe-area-inset-bottom,0px);}
.vh-bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;
  cursor:pointer;color:var(--muted);font-size:.62rem;font-weight:700;background:none;border:none;}
.vh-bn-item svg{width:22px;height:22px;}
.vh-bn-item.active{color:var(--navy);}
.vh-bn-create{width:40px;height:28px;background:var(--navy);border-radius:8px;display:flex;align-items:center;
  justify-content:center;color:#fff;margin-bottom:2px;}
.vh-bn-create svg{width:18px;height:18px;}

/* ── CREATE ACTION-SHEET — tapping + shows a type picker instead of
   guessing what someone wants to make (matches YouTube's own Create flow) ── */
.vh-create-sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600;display:none;
  align-items:flex-end;justify-content:center;}
.vh-create-sheet-overlay.open{display:flex;}
.vh-create-sheet{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;
  padding:10px 8px calc(14px + env(safe-area-inset-bottom,0px));}
.vh-create-sheet-handle{width:36px;height:4px;background:var(--border);border-radius:3px;margin:4px auto 12px;}
.vh-create-opt{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;border-radius:12px;}
.vh-create-opt:active{background:var(--cream);}
.vh-create-opt-icon{width:42px;height:42px;border-radius:50%;background:var(--orange-light);display:flex;
  align-items:center;justify-content:center;font-size:1.15rem;flex-shrink:0;}
.vh-create-opt-text{flex:1;}
.vh-create-opt-title{font-weight:700;font-size:.9rem;color:var(--charcoal);}
.vh-create-opt-sub{font-size:.74rem;color:var(--muted);margin-top:1px;}
.vh-create-opt.disabled{opacity:.5;}
.vh-create-opt.disabled .vh-create-opt-sub{color:var(--orange-dark);font-weight:700;}

.vh-shorts-row{padding:14px 16px 6px;}
.vh-shorts-title{font-size:.82rem;font-weight:800;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.vh-shorts-scroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;}
.vh-shorts-scroll::-webkit-scrollbar{display:none;}
.vh-short-card{flex-shrink:0;width:112px;aspect-ratio:9/16;border-radius:12px;overflow:hidden;position:relative;
  background:var(--navy);cursor:pointer;}
.vh-short-card img,.vh-short-card video{width:100%;height:100%;object-fit:cover;}
.vh-short-views{position:absolute;bottom:6px;left:6px;color:#fff;font-size:.65rem;font-weight:700;
  text-shadow:0 1px 3px rgba(0,0,0,.6);display:flex;align-items:center;gap:3px;}
.vh-section-divider{height:8px;background:var(--cream);border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-top:8px;}

/* ── FEED — flush, edge-to-edge, continuous list (not a padded card grid) ── */
.vh-grid{display:flex;flex-direction:column;}
.vh-card{cursor:pointer;padding-bottom:14px;margin-bottom:14px;border-bottom:8px solid var(--cream);}
.vh-card:last-child{border-bottom:none;}
.vh-thumb-wrap{position:relative;aspect-ratio:16/9;background:var(--border);overflow:hidden;}
.vh-thumb-wrap img,.vh-thumb-wrap video{width:100%;height:100%;object-fit:cover;}
.vh-duration-badge{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.75);color:#fff;
  font-size:.68rem;font-weight:700;padding:2px 6px;border-radius:5px;}
.vh-play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.15);}
.vh-play-overlay svg{width:44px;height:44px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));}
.vh-card-body{padding:10px 16px 0;display:flex;gap:10px;}
.vh-card-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--navy);flex-shrink:0;margin-top:1px;}
.vh-card-info{flex:1;min-width:0;}
.vh-card-title{font-size:.9rem;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;margin-bottom:3px;}
.vh-card-meta{font-size:.74rem;color:var(--muted);}

/* ── COMMUNITY POST CARD — DELTA Video's own Posts (createdFrom==video_hub)
   render differently from a video card: image + caption + a YouTube-style
   like/dislike/share/comment row, no thumbnail-play-overlay, no duration. ── */
.vh-post-card{padding:14px 16px;}
.vh-post-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.vh-post-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--navy);flex-shrink:0;}
.vh-post-authorname{font-weight:700;font-size:.86rem;}
.vh-post-time{font-size:.72rem;color:var(--muted);}
.vh-post-caption{font-size:.86rem;line-height:1.55;margin-bottom:10px;white-space:pre-wrap;}
.vh-post-img{width:100%;border-radius:12px;object-fit:cover;max-height:420px;margin-bottom:10px;}
.vh-post-actions{display:flex;align-items:center;gap:18px;}
.vh-post-action{display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;
  color:var(--charcoal);font-size:.8rem;font-weight:700;padding:4px;}
.vh-post-action svg{width:19px;height:19px;}
.vh-post-action.liked{color:#2e7d32;}
.vh-post-action.disliked{color:#c0392b;}

.vh-empty{padding:60px 24px;text-align:center;color:var(--muted);font-size:.85rem;line-height:1.7;}
.vh-empty-btn{display:inline-block;margin-top:14px;background:var(--navy);color:#fff;border:none;
  padding:11px 22px;border-radius:22px;font-weight:700;font-size:.82rem;cursor:pointer;text-decoration:none;}

/* ── PLAYER OVERLAY ── */
.vh-player-overlay{position:fixed;inset:0;background:var(--cream);z-index:500;display:none;overflow-y:auto;}
.vh-player-overlay.open{display:block;}
.vh-player-video-wrap{background:#000;aspect-ratio:16/9;position:relative;}
.vh-player-video-wrap video{width:100%;height:100%;object-fit:contain;}
.vh-player-close{position:absolute;top:12px;left:12px;z-index:10;background:rgba(0,0,0,.5);color:#fff;
  border:none;width:32px;height:32px;border-radius:50%;font-size:1rem;cursor:pointer;}
.vh-player-body{padding:16px;}
.vh-player-title{font-size:1.05rem;font-weight:800;line-height:1.4;margin-bottom:10px;}
.vh-player-stats{font-size:.78rem;color:var(--muted);margin-bottom:14px;}
.vh-player-creator-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);margin-bottom:14px;}
.vh-player-creator-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--navy);}
.vh-player-creator-name{font-weight:700;font-size:.9rem;flex:1;}
.vh-follow-btn{background:var(--navy);color:#fff;border:none;padding:8px 18px;border-radius:20px;
  font-weight:700;font-size:.78rem;cursor:pointer;}
.vh-follow-btn.following{background:var(--border);color:var(--charcoal);}
.vh-player-actions{display:flex;gap:20px;margin-bottom:16px;}
.vh-action-btn{background:none;border:none;display:flex;align-items:center;gap:6px;font-size:.82rem;
  font-weight:700;color:var(--charcoal);cursor:pointer;}
.vh-action-btn.liked{color:#e0245e;}
.vh-player-caption{font-size:.84rem;line-height:1.6;color:var(--charcoal);margin-bottom:20px;}

.vh-related-title{font-size:.78rem;font-weight:800;color:var(--navy);text-transform:uppercase;
  letter-spacing:.04em;margin-bottom:12px;padding:0 16px;}
.vh-related-list{padding:0 16px;display:flex;flex-direction:column;gap:12px;}
.vh-related-card{display:flex;gap:10px;cursor:pointer;}
.vh-related-thumb{width:120px;aspect-ratio:16/9;border-radius:10px;object-fit:cover;background:var(--border);flex-shrink:0;}
.vh-related-info{flex:1;min-width:0;}
.vh-related-name{font-size:.82rem;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;}
.vh-related-meta{font-size:.7rem;color:var(--muted);margin-top:4px;}
</style>
</head>
<body>

<div class="vh-topbar">
  <div class="vh-logo" onclick="history.length>1?history.back():location.href='media-feed.html'">

  <button class="vh-topbar-btn" onclick="showComingSoonToast()" title="Notifications">

  <div class="vh-search-expand" id="vhSearchExpand">

    </div>
    <div class="vh-create-opt disabled" onclick="alert('Live শীঘ্রই আসছে')">

    </div>
    <div class="vh-create-opt" onclick="location.href='create-studio.html?type=post&from=video_hub&city='+CITY">

    </div>
  </div>
</div>

<div class="vh-player-overlay" id="vhPlayerOverlay">
  <div class="vh-player-video-wrap">
    <button class="vh-player-close" onclick="closePlayer()">✕</button>

  </div>

  </div>
  <div class="vh-related-title">আরও ভিডিও</div>
  <div class="vh-related-list" id="vhRelatedList"></div>
</div>

async function loadVideos(){
  var grid = document.getElementById('vhGrid');
  grid.innerHTML = '<div class="vh-empty">লোড হচ্ছে...</div>';
  if(IS_DEMO){
    // 'following'/'nearby' don't have meaningful demo behavior distinct from
    // 'all' — real Firestore mode still filters properly; demo is for
    // visual-layout testing only, not for testing filter logic itself.
    _vhAllVideos = DEMO_VIDEOS.slice();
    if(currentFilter === 'trending'){
      _vhAllVideos = _vhAllVideos.slice().sort(function(a,b){ return b.data.stats.views - a.data.stats.views; });
    }
    renderVideoGrid(_vhAllVideos);
    return;
  }
  try{
    var base = db.collection('cities').doc(CITY).collection('mediaContent').where('status','==','published');
    var followedIds = null;

    if(currentFilter === 'following' && currentUser){
      await loadMyFollowing();
      followedIds = Object.keys(_vhMyFollowing);
      if(!followedIds.length){
        grid.innerHTML = '<div class="vh-empty">আপনি এখনো কাউকে follow করেননি।<br>Follow করা creator-দের ভিডিও এখানে দেখা যাবে।</div>';
        return;
      }
    } else if(currentFilter === 'following' && !currentUser){
      grid.innerHTML = '<div class="vh-empty">Follow করা creator-দের ভিডিও দেখতে আগে লগইন করুন।</div>';
      return;
    }

    // DELTA Video's feed is a merge of THREE distinct queries, not one —
    // this is the content-visibility architecture worked out with the
    // founder: (1) every Video regardless of where it was made, (2) Posts
    // made specifically from DELTA Video's own + button (its "Community
    // Post" equivalent — a plain Feed-made Post never appears here), and
    // (3) Shorts made specifically from DELTA Video's own + button (these
    // are deliberately NOT the same thing as a Reel made in Reels section
    // or Media Feed — see reels-player.html's matching exclusion).
    // Firestore's compat SDK can't OR across different field values in one
    // query, so these run in parallel and get merged client-side.
    function scoped(q){
      if(currentFilter === 'official') return q.where('authorUid','==', OFFICIAL_UID);
      if(followedIds) return q.where('authorUid','in', followedIds.slice(0,10));
      return q;
    }
    var videoQ = scoped(base.where('type','==','video')).orderBy('createdAt','desc').limit(40).get();
    var ownPostQ = scoped(base.where('type','==','post').where('createdFrom','==','video_hub')).orderBy('createdAt','desc').limit(20).get();
    var ownShortsQ = scoped(base.where('type','==','reel').where('createdFrom','==','video_hub')).orderBy('createdAt','desc').limit(20).get();

    var results = await Promise.all([videoQ, ownPostQ, ownShortsQ]);
    var merged = [];
    results.forEach(function(snap){ snap.docs.forEach(function(d){ merged.push({id:d.id, data:d.data()}); }); });
    merged.sort(function(a,b){ return new Date(b.data.createdAt) - new Date(a.data.createdAt); });
    _vhAllVideos = merged.slice(0, 40);

    if(currentFilter === 'trending'){
      _vhAllVideos.sort(function(a,b){ return ((b.data.stats&&b.data.stats.views)||0) - ((a.data.stats&&a.data.stats.views)||0); });
    }
    // 'nearby' — no geo-distance data exists on mediaContent yet (same
    // honest limitation already noted in reels-player.html); falls back to
    // the standard newest-first list rather than pretending to filter.

    // Live profile lookup, not the frozen authorAvatarUrl/authorDisplayName
    // snapshot saved on each video at upload time — otherwise a name/DP set
    // or changed AFTER an old video was uploaded never shows up on that
    // video (same fix already applied in media-feed.html and reels-player.html;
    // this page had simply never gotten it).
    var uniqueAuthorUids = Array.from(new Set(_vhAllVideos.map(function(item){ return item.data.authorUid; }).filter(Boolean)));
    var uidsToFetch = uniqueAuthorUids.filter(function(uid){ return !_vhLiveProfileCache[uid]; });
    if(uidsToFetch.length){
      try{
        var profileDocs = await Promise.all(uidsToFetch.map(function(uid){ return db.collection('mediaProfiles').doc(uid).get(); }));
        profileDocs.forEach(function(doc, i){
          _vhLiveProfileCache[uidsToFetch[i]] = doc.exists ? {avatarUrl: doc.data().avatarUrl, displayName: doc.data().displayName} : {};
        });
      }catch(e){ console.warn('Live profile fetch failed (non-fatal, falls back to upload-time snapshot)', e); }
    }

    renderVideoGrid(_vhAllVideos);
  }catch(e){
    console.error('Video load error (likely missing composite index)', e);
    grid.innerHTML = '<div class="vh-empty">লোড করতে সমস্যা হয়েছে — সম্ভবত Firestore index তৈরি করা লাগবে। Console দেখুন।</div>';
  }
}

// ── Community Post card (YouTube Community Post equivalent) — only for
// content created via DELTA Video's own + button with type=='post'. Unlike
// a video, this renders its like/dislike/share/comment row directly inline
// in the feed (no full-screen player needed for a text+image post). ──
function buildCommunityPostCard(item){
  var d = item.data;
  var liveProfile = _vhLiveProfileCache[d.authorUid] || {};
  var liveAvatarUrl = liveProfile.avatarUrl || d.authorAvatarUrl || '';
  var liveDisplayName = liveProfile.displayName || d.authorDisplayName || 'DELTA Creator';
  var img = (d.mediaUrls && d.mediaUrls[0]) || '';
  var card = document.createElement('div'); card.className = 'vh-card vh-post-card';
  card.innerHTML =
    '<div class="vh-post-head">'+
      (liveAvatarUrl ? '<img class="vh-post-avatar" src="'+liveAvatarUrl+'">' : '<div class="vh-post-avatar"></div>')+
      '<div><div class="vh-post-authorname">'+liveDisplayName+'</div><div class="vh-post-time">'+timeAgoVh(d.createdAt)+'</div></div>'+
    '</div>'+
    (d.caption ? '<div class="vh-post-caption">'+d.caption+'</div>' : '')+
    (img ? '<img class="vh-post-img" src="'+img+'">' : '')+
    '<div class="vh-post-actions">'+
      '<button class="vh-post-action" id="vhPostLike-'+item.id+'">👍 <span>'+((d.stats&&d.stats.likes)||0)+'</span></button>'+
      '<button class="vh-post-action" id="vhPostDislike-'+item.id+'">👎</button>'+
      '<button class="vh-post-action" onclick="sharePostCard(\''+item.id+'\')">↗ Share</button>'+
      '<button class="vh-post-action">💬 '+((d.stats&&d.stats.comments)||0)+'</button>'+
    '</div>';
  var likeBtn = card.querySelector('#vhPostLike-'+item.id);
  var dislikeBtn = card.querySelector('#vhPostDislike-'+item.id);
  likeBtn.onclick = function(){ togglePostReaction(item.id, 'likes', likeBtn, dislikeBtn); };
  dislikeBtn.onclick = function(){ togglePostReaction(item.id, 'dislikes', dislikeBtn, likeBtn); };
  refreshPostReactionState(item.id, likeBtn, dislikeBtn);
  return card;
}

async function refreshPostReactionState(contentId, likeBtn, dislikeBtn){
  if(!currentUser) return;
  try{
    var ref = db.collection('cities').doc(CITY).collection('mediaContent').doc(contentId);
    var likeDoc = await ref.collection('likes').doc(currentUser.uid).get();
    var dislikeDoc = await ref.collection('dislikes').doc(currentUser.uid).get();
    likeBtn.classList.toggle('liked', likeDoc.exists);
    dislikeBtn.classList.toggle('disliked', dislikeDoc.exists);
  }catch(e){ console.warn(e); }
}

// Liking and disliking are mutually exclusive — same as YouTube's own
// behavior — so setting one always clears the other first.
async function togglePostReaction(contentId, kind, activeBtn, otherBtn){
  if(!currentUser){ alert('আগে লগইন করুন'); return; }
  var ref = db.collection('cities').doc(CITY).collection('mediaContent').doc(contentId);
  var otherKind = kind === 'likes' ? 'dislikes' : 'likes';
  var mine = ref.collection(kind).doc(currentUser.uid);
  var otherMine = ref.collection(otherKind).doc(currentUser.uid);
  var existing = await mine.get();
  if(existing.exists){
    await mine.delete();
    activeBtn.classList.remove(kind==='likes'?'liked':'disliked');
  } else {
    await mine.set({createdAt:new Date().toISOString()});
    activeBtn.classList.add(kind==='likes'?'liked':'disliked');
    var otherExisting = await otherMine.get();
    if(otherExisting.exists){ await otherMine.delete(); otherBtn.classList.remove(otherKind==='likes'?'liked':'disliked'); }
  }
}

function openVideoById(id){
  var found = _vhAllVideos.find(function(item){ return item.id===id; });
  if(found){ openVideo(found.id, found.data); return; }
  // Not in the currently-loaded grid (different filter, or older than the
  // 40-item cap) — fetch it directly by ID instead of giving up.
  db.collection('cities').doc(CITY).collection('mediaContent').doc(id).get().then(async function(doc){
    if(!doc.exists) return;
    var d = doc.data();
    if(d.authorUid && !_vhLiveProfileCache[d.authorUid]){
      try{
        var pDoc = await db.collection('mediaProfiles').doc(d.authorUid).get();
        _vhLiveProfileCache[d.authorUid] = pDoc.exists ? {avatarUrl: pDoc.data().avatarUrl, displayName: pDoc.data().displayName} : {};
      }catch(e){ console.warn('Live profile fetch failed for deep-linked video', e); }
    }
    openVideo(doc.id, d);
  }).catch(function(e){ console.warn('Deep-linked video fetch failed', e); });
}

  var liveDisplayName = liveProfile.displayName || d.authorDisplayName || 'DELTA Creator';
  var videoEl = document.getElementById('vhPlayerVideo');
  videoEl.src = d.videoUrl || '';
  videoEl.poster = d.thumbnailUrl || '';
  videoEl.play().catch(function(){});
  document.getElementById('vhPlayerTitle').textContent = d.videoTitle || d.caption || '—';
  document.getElementById('vhPlayerStats').textContent = '👁 '+((d.stats&&d.stats.views)||0)+' views · '+timeAgoVh(d.createdAt);
  document.getElementById('vhPlayerAvatar').src = liveAvatarUrl;
  document.getElementById('vhPlayerCreatorName').textContent = liveDisplayName;
  document.getElementById('vhPlayerCaption').textContent = d.caption || '';
  document.getElementById('vhLikeCount').textContent = (d.stats&&d.stats.likes)||0;
  document.getElementById('vhPlayerOverlay').classList.add('open');
  refreshVhFollowBtn(d.authorUid);
  refreshVhLikeBtn(id);
  renderRelatedVideos(id);

}

function timeAgoVh(iso){
  if(!iso) return '';
  var diff = (Date.now() - new Date(iso).getTime())/1000;
  if(diff < 3600) return Math.floor(diff/60)+' মিনিট আগে';
  if(diff < 86400) return Math.floor(diff/3600)+' ঘণ্টা আগে';
  return Math.floor(diff/86400)+' দিন আগে';
}

}
async function toggleVhFollow(){
  if(!currentUser){ alert('লগইন করুন প্রথমে'); return; }
  var authorUid = _vhCurrentPlayingData.authorUid;
  var followerDoc = db.collection('mediaProfiles').doc(authorUid).collection('followers').doc(currentUser.uid);
  var followingDoc = db.collection('mediaProfiles').doc(currentUser.uid).collection('following').doc(authorUid);
  var existing = await followerDoc.get();
  if(existing.exists){ await followerDoc.delete(); await followingDoc.delete(); }
  else { await followerDoc.set({followedAt:new Date().toISOString()}); await followingDoc.set({followedAt:new Date().toISOString()}); }
  refreshVhFollowBtn(authorUid);
}

async function refreshVhLikeBtn(contentId){
  var btn = document.getElementById('vhLikeBtn');
  if(!currentUser){ btn.classList.remove('liked'); return; }
  try{
    var doc = await db.collection('cities').doc(CITY).collection('mediaContent').doc(contentId).collection('likes').doc(currentUser.uid).get();
    btn.classList.toggle('liked', doc.exists);
  }catch(e){ console.warn(e); }
}
async function toggleVhLike(){
  if(!currentUser){ alert('লগইন করুন প্রথমে'); return; }
  var ref = db.collection('cities').doc(CITY).collection('mediaContent').doc(_vhCurrentPlayingId).collection('likes').doc(currentUser.uid);
  var btn = document.getElementById('vhLikeBtn');
  var countEl = document.getElementById('vhLikeCount');
  var existing = await ref.get();
  if(existing.exists){
    await ref.delete();
    btn.classList.remove('liked');
    countEl.textContent = Math.max(0, Number(countEl.textContent)-1);
  } else {
    await ref.set({likedAt:new Date().toISOString()});
    btn.classList.add('liked');
    countEl.textContent = Number(countEl.textContent)+1;
  }
}
function shareVhVideo(){
  var url = location.origin+location.pathname+'?city='+CITY+'&id='+_vhCurrentPlayingId;
  if(navigator.share){ navigator.share({title:_vhCurrentPlayingData.videoTitle||'DELTA Video', url:url}).catch(function(){}); }
  else { navigator.clipboard.writeText(url); alert('লিংক কপি হয়েছে'); }
}

function renderRelatedVideos(excludeId){
  var wrap = document.getElementById('vhRelatedList');
  var related = _vhAllVideos.filter(function(item){ return item.id !== excludeId; }).slice(0, 8);
  if(!related.length){ wrap.innerHTML = '<div style="color:var(--muted);font-size:.8rem;">আর কোনো ভিডিও নেই।</div>'; return; }
  wrap.innerHTML = '';
  related.forEach(function(item){
    var d = item.data;
    var thumb = d.thumbnailUrl || '';
    var liveProfile = _vhLiveProfileCache[d.authorUid] || {};
    var liveDisplayName = liveProfile.displayName || d.authorDisplayName || 'DELTA Creator';
    var card = document.createElement('div'); card.className = 'vh-related-card';
    card.innerHTML =
      (thumb ? '<img class="vh-related-thumb" src="'+thumb+'">' : '<div class="vh-related-thumb"></div>')+
      '<div class="vh-related-info">'+
        '<div class="vh-related-name">'+(d.videoTitle||d.caption||'—')+'</div>'+
        '<div class="vh-related-meta">'+liveDisplayName+' · 👁 '+((d.stats&&d.stats.views)||0)+'</div>'+
      '</div>';
    card.onclick = function(){ openVideo(item.id, d); };
    wrap.appendChild(card);
  });
}
</script>
