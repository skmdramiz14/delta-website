<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>সব দোকান — DELTA</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --navy:#0a1f35;--navy2:#122840;--navy3:#061526;
  --orange:#f07018;--orange2:#ff8c3a;--orange-dark:#d9610f;
  --green:#2da86a;--green2:#1a7a4c;
  --white:#fff;--sand:#eef2f7;--cream:#f7f9fc;
  --border:#dde5ef;--muted:#6b7b8d;--gray:#6b7b8d;--charcoal:#1a2535;
  --orange-light:#fff4ec;
}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--charcoal);}

/* ── NAV ── */
.nav{background:var(--navy);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.nav-logo{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:900;color:#fff;cursor:pointer;text-decoration:none;}
.nav-logo em{color:var(--orange);font-style:normal;}
.nav-back{color:rgba(255,255,255,.7);font-size:.85rem;cursor:pointer;display:flex;align-items:center;gap:6px;text-decoration:none;}
.nav-back:hover{color:#fff;}
.nav-lang{display:flex;gap:2px;background:rgba(255,255,255,.1);border-radius:20px;padding:3px;}
.lang-btn{padding:4px 10px;border-radius:16px;border:none;background:transparent;color:rgba(255,255,255,.6);font-size:.75rem;font-weight:700;cursor:pointer;transition:all .2s;}
.lang-btn.active{background:var(--orange);color:#fff;}

/* ── HERO BANNER ── */
.hero-banner{background:linear-gradient(135deg,var(--navy3),var(--navy),#1c3a5e);padding:32px 20px 40px;text-align:center;position:relative;overflow:hidden;}
.hero-banner::before{content:'🏪';position:absolute;left:-20px;top:-10px;font-size:8rem;opacity:.12;}
.hero-banner::after{content:'🛍️';position:absolute;right:-20px;bottom:-10px;font-size:8rem;opacity:.12;}
.hero-title{font-family:'Playfair Display',serif;font-size:clamp(1.6rem,5vw,2.4rem);font-weight:900;color:#fff;margin-bottom:8px;}
.hero-sub{color:rgba(255,255,255,.85);font-size:.88rem;margin-bottom:6px;max-width:500px;margin-left:auto;margin-right:auto;}
.hero-count{color:rgba(255,255,255,.95);font-size:.8rem;font-weight:700;margin-top:10px;}

/* ── MAIN CONTENT ── */
.main{max-width:1100px;margin:0 auto;padding:24px 16px 60px;}
.section-label{font-size:.75rem;font-weight:700;color:var(--orange);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px;}
.section-title{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:900;color:var(--navy);margin-bottom:16px;}

/* ── OPEN NOW FILTER ── */
.open-now-bar{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
.open-now-toggle{display:flex;align-items:center;gap:8px;background:var(--white);border:1.5px solid var(--border);border-radius:20px;padding:8px 16px;cursor:pointer;transition:all .2s;}
.open-now-toggle .dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:background .2s;}
.open-now-toggle.active{border-color:var(--green);background:#eef9f0;}
.open-now-toggle.active .dot{background:var(--green);}
.open-now-count{font-size:.78rem;color:var(--muted);font-weight:600;}

/* ── SHOPS GRID ── */
.shops-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
@media(max-width:1000px){.shops-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:760px){.shops-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:480px){.shops-grid{grid-template-columns:1fr;}}

/* ── MOBILE FIX ── */
@media(max-width:768px){
  html,body{overflow-x:hidden;max-width:100vw;}
  *{max-width:100%;}
  .shops-hero{padding:28px 4% 32px;}
  .shops-hero h1{font-size:1.6rem;}
  .shops-filter-bar{padding:10px 4%;gap:6px;}
  .shops-section{padding:20px 4%;}
  .shop-card{border-radius:12px;}
}
@media(max-width:480px){
  .shops-hero h1{font-size:1.4rem;}
  .shops-grid{grid-template-columns:1fr!important;}
  .filter-pill{padding:6px 12px;font-size:.76rem;}
}
.shop-card{background:var(--white);border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06);cursor:pointer;transition:transform .2s;}
.shop-card:hover{transform:translateY(-3px);}
.shop-banner{height:108px;background:linear-gradient(135deg,var(--navy),var(--navy2));display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative;}
.shop-banner img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
.shop-open-pill{position:absolute;top:8px;right:8px;font-size:.65rem;font-weight:700;padding:3px 9px;border-radius:10px;}
.shop-open-pill.open{background:#eef9f0;color:#1a7a4c;}
.shop-open-pill.closed{background:#fdeeec;color:#c0392b;}
.shop-body{padding:12px 14px 14px;}
.shop-name{font-weight:800;font-size:.92rem;color:var(--navy);margin-bottom:3px;}
.shop-cat{font-size:.74rem;color:var(--muted);margin-bottom:8px;}
.shop-meta{font-size:.7rem;color:var(--muted);display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.shop-rating{color:var(--orange);font-weight:700;}
.sep{opacity:.5;}

.empty-state{text-align:center;padding:60px 20px;color:var(--muted);grid-column:1/-1;}
.empty-icon{font-size:2.5rem;margin-bottom:10px;}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 22px;border-radius:10px;font-size:.85rem;font-weight:600;z-index:9999;display:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.3);}
.toast.show{display:block;animation:fadeInUp .3s ease;}
@keyframes fadeInUp{from{opacity:0;transform:translate(-50%,20px);}to{opacity:1;transform:translate(-50%,0);}}

/* ── LANG ── */
body.lang-en .lang-bn{display:none!important;}
body.lang-bn .lang-en{display:none!important;}
</style>
</head>
<body class="lang-bn">

<!-- NAV -->
<nav class="nav">
  <a class="nav-back" href="index.html">← <span class="lang-bn">হোমে ফিরুন</span><span class="lang-en">Back to Home</span></a>
  <a class="nav-logo" href="index.html">△ DELT<em>A</em></a>
  <div class="nav-lang">
    <button class="lang-btn active" id="langBn" onclick="setLang('bn')">বাং</button>
    <button class="lang-btn" id="langEn" onclick="setLang('en')">ENG</button>
  </div>
</nav>

<!-- HERO BANNER -->
<div class="hero-banner">
  <div class="hero-title">🏪 <span class="lang-bn">সব দোকান</span><span class="lang-en">All Shops</span></div>
  <p class="hero-sub">
    <span class="lang-bn">মন্তেশ্বর ব্লকের সব স্থানীয় দোকান এক জায়গায়</span>
    <span class="lang-en">All local shops in Manteswar Block, in one place</span>
  </p>
  <div class="hero-count" id="heroCount"><span class="lang-bn">লোড হচ্ছে...</span><span class="lang-en">Loading...</span></div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="section-label"><span class="lang-bn">আবিষ্কার করুন</span><span class="lang-en">Discover</span></div>
  <div class="section-title"><span class="lang-bn">কাছের দোকান</span><span class="lang-en">Nearby Shops</span></div>

  <div class="open-now-bar">
    <div class="open-now-toggle" id="openNowToggle" onclick="toggleOpenNow()">
      <div class="dot"></div>
      <span style="font-size:.82rem;font-weight:600;">
        <span class="lang-bn">এখন খোলা</span><span class="lang-en">Open Now</span>
      </span>
    </div>
    <span class="open-now-count" id="openNowCount"></span>
  </div>

  <div class="shops-grid" id="shopsGrid">
    <div class="empty-state"><div class="empty-icon">⏳</div><p><span class="lang-bn">লোড হচ্ছে...</span><span class="lang-en">Loading...</span></p></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var currentLang='bn';
function setLang(l){
  currentLang=l;
  document.body.className='lang-'+l;
  document.getElementById('langBn').classList.toggle('active',l==='bn');
  document.getElementById('langEn').classList.toggle('active',l==='en');
  renderShopsGrid(openNowActive ? allShops.filter(function(s){return s.isOpen!==false;}) : allShops);
}
function showToast(msg,type){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.style.background=type==='green'?'#1a8a4a':'#0a1f35';
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2800);
}

var allShops = [];
var openNowActive = false;
var fbcfg={apiKey:"AIzaSyA6TrrnCMwv1aa1WPqGvTVWlnieB2pVOEU",authDomain:"delta-platform-82fc0.firebaseapp.com",projectId:"delta-platform-82fc0",storageBucket:"delta-platform-82fc0.firebasestorage.app",messagingSenderId:"444904180433",appId:"1:444904180433:web:6706eba4d73a30cd67d3f0"};
var CITY='manteswar';

var SHOP_EMOJI = {
  '🍛':'🍛','food':'🍛','খাদ্য':'🍛',
  'grocery':'🛒','মুদিখানা':'🛒',
  'farm':'🌾','কৃষি':'🌾',
  'pharmacy':'💊','ওষুধ':'💊',
  'clothing':'👗','পোশাক':'👗',
  'electronics':'📱','ইলেকট্রনিক্স':'📱',
  'arts':'🎨','শিল্প':'🎨',
  'services':'💈','সেবা':'💈'
};
function shopEmoji(cat){
  cat = (cat||'').toLowerCase();
  for(var k in SHOP_EMOJI){ if(cat.indexOf(k.toLowerCase())!==-1) return SHOP_EMOJI[k]; }
  return '🏪';
}

(function(){
  var s=['https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js','https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js'];
  var n=0;
  s.forEach(function(src){
    var el=document.createElement('script'); el.src=src;
    el.onload=function(){ if(++n===s.length) initFB(); };
    el.onerror=function(){ renderShopsGrid([]); };
    document.head.appendChild(el);
  });
})();

function initFB(){
  try{
    firebase.initializeApp(fbcfg);
    var db=firebase.firestore();
    db.collection('cities').doc(CITY).collection('sellers').get().then(function(snap){
      allShops=[];
      snap.forEach(function(d){
        var shop = Object.assign({id:d.id},d.data());
        if(shop.status === 'pending') return; // hide shops awaiting admin approval
        allShops.push(shop);
      });
      renderShopsGrid(allShops);
    }).catch(function(){ renderShopsGrid([]); });
  }catch(e){ renderShopsGrid([]); }
}

function renderShopsGrid(shops){
  var g=document.getElementById('shopsGrid');
  var countEl=document.getElementById('heroCount');
  var isEn=currentLang==='en';

  countEl.innerHTML = '<span class="lang-bn">'+allShops.length+' টি দোকান — মন্তেশ্বর ব্লক</span><span class="lang-en">'+allShops.length+' shops — Manteswar Block</span>';

  if(!shops.length){
    g.innerHTML='<div class="empty-state"><div class="empty-icon">🏪</div><p>'+(isEn?'No shops found yet':'এখনো কোনো দোকান যোগ হয়নি')+'</p></div>';
    return;
  }
  g.innerHTML=shops.map(function(s){
    var open=s.isOpen!==false; var em=shopEmoji(s.category);
    var openLabel=isEn?(open?'✅ Open':'❌ Closed'):(open?'✅ খোলা':'❌ বন্ধ');
    var thumb = (s.shopImages && s.shopImages[0]) ? '<img src="'+s.shopImages[0]+'">' : em;
    return '<div class="shop-card" onclick="window.location.href=\'index.html?shop='+s.id+'\'">'+
      '<div class="shop-banner">'+thumb+'<span class="shop-open-pill '+(open?'open':'closed')+'">'+openLabel+'</span></div>'+
      '<div class="shop-body"><div class="shop-name">'+(s.shopName||'দোকান')+'</div>'+
      '<div class="shop-cat">'+(s.category||'')+(s.area?' · '+s.area:'')+'</div>'+
      '<div class="shop-meta"><span class="shop-rating">⭐ '+(s.rating||'4.8')+'</span><span class="sep">·</span><span>'+(s.area||'Manteswar')+'</span><span class="sep">·</span><span>🕐 '+(s.openTime||'9:00')+'-'+(s.closeTime||'21:00')+'</span></div></div></div>';
  }).join('');
}

function toggleOpenNow(){
  openNowActive = !openNowActive;
  var toggle = document.getElementById('openNowToggle');
  toggle.classList.toggle('active', openNowActive);
  var cnt = document.getElementById('openNowCount');

  if(openNowActive){
    var open = allShops.filter(function(s){ return s.isOpen !== false; });
    renderShopsGrid(open);
    if(cnt) cnt.textContent = open.length + (currentLang==='bn' ? 'টি দোকান খোলা' : ' shops open');
  } else {
    renderShopsGrid(allShops);
    if(cnt) cnt.textContent = '';
  }
}

// Safety: if Firebase scripts take too long, show empty state after 6s instead of hanging
setTimeout(function(){
  if(document.getElementById('shopsGrid').innerHTML.indexOf('লোড হচ্ছে') !== -1){
    renderShopsGrid(allShops);
  }
},6000);
</script>
</body>
</html>
