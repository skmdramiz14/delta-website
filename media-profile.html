<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DELTA Media — Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="delta-shared.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{overflow-x:hidden;max-width:100vw;}
:root{
  --navy:#141414;--navy2:#1f1f1f;
  --gold:#C9971F;--gold-dark:#8B6F1F;
  --green:#2da86a;--green2:#7A6420;
  --white:#fff;--sand:#ffffff;--cream:#F7F2E7;
  --border:#E8E0CE;--muted:#8A8478;--charcoal:#1A1712;
}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--charcoal);padding-bottom:40px;}

/* ── Top bar ── */
.pp-nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;}
.pp-nav-btn{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);border:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;}
.pp-nav-btn.solid{background:#fff;color:var(--charcoal);box-shadow:0 1px 4px rgba(0,0,0,.15);}
.pp-nav-right{display:flex;gap:8px;}

/* ── Cover ── */
.pp-cover{width:100%;height:180px;background:linear-gradient(135deg,#0d0d0d,#2b2210 55%,#0d0d0d);position:relative;overflow:hidden;}
.pp-cover img{width:100%;height:100%;object-fit:cover;display:block;}
.pp-cover-edit{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.45);color:#fff;border:none;border-radius:16px;
  padding:6px 12px;font-size:.7rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;}

/* ── Header block ── */
.pp-header{padding:0 18px;position:relative;}
.pp-avatar-wrap{width:92px;height:92px;border-radius:50%;border:4px solid #fff;background:var(--cream);
  position:relative;top:-46px;margin-bottom:-36px;box-shadow:0 2px 8px rgba(0,0,0,.12);}
.pp-avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;}
.pp-avatar-fallback{width:100%;height:100%;border-radius:50%;background:var(--navy);color:var(--gold);
  display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:800;}
.pp-avatar-edit{position:absolute;bottom:2px;right:2px;width:26px;height:26px;border-radius:50%;background:var(--navy);
  border:2px solid #fff;color:var(--gold);display:flex;align-items:center;justify-content:center;cursor:pointer;}

.pp-name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.pp-name{font-family:'Playfair Display',serif;font-weight:800;font-size:1.3rem;color:var(--charcoal);}
.pp-badge{display:inline-flex;align-items:center;gap:4px;font-size:.62rem;font-weight:800;padding:3px 9px;border-radius:9px;
  text-transform:uppercase;letter-spacing:.3px;}
.pp-badge.seller{background:#F1EBD8;color:var(--green2);}
.pp-badge.creator{background:#F3EEE3;color:var(--gold-dark);}
.pp-badge.official{background:linear-gradient(135deg,#4a90d9,#8b5cf6,#e0245e);color:#fff;}
.pp-badge.verified{background:var(--navy);color:var(--gold);}
.pp-username{color:var(--muted);font-size:.82rem;margin-top:2px;}

.pp-stats{display:flex;gap:22px;margin:14px 0 4px;}
.pp-stat{cursor:pointer;}
.pp-stat b{display:block;font-size:1.02rem;font-weight:800;color:var(--charcoal);}
.pp-stat span{font-size:.72rem;color:var(--muted);}

.pp-bio{font-size:.85rem;color:var(--charcoal);line-height:1.5;margin-top:10px;white-space:pre-wrap;}
.pp-meta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:.76rem;color:var(--muted);}
.pp-meta-row span{display:flex;align-items:center;gap:4px;}

.pp-actions{display:flex;gap:8px;margin:16px 0 6px;}
.pp-btn{flex:1;padding:11px;border-radius:20px;font-weight:700;font-size:.82rem;cursor:pointer;border:none;text-align:center;}
.pp-btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#fff;}
.pp-btn-primary.following{background:var(--border);color:var(--charcoal);}
.pp-btn-secondary{background:var(--sand);color:var(--charcoal);border:1.5px solid var(--gold);}
.pp-btn-icon{flex:0 0 auto;width:42px;background:var(--sand);border:1.5px solid var(--border);border-radius:20px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;}

/* ── Tabs ── */
.pp-see-more{color:var(--gold-dark);font-weight:700;cursor:pointer;}

.pp-link-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.pp-link-chip{display:inline-flex;align-items:center;gap:5px;background:var(--sand);border:1px solid var(--border);
  border-radius:16px;padding:6px 12px;font-size:.72rem;font-weight:700;color:var(--charcoal);text-decoration:none;}

/* ── Story Highlights row ── */
.pp-highlights-row{display:flex;gap:16px;overflow-x:auto;padding:16px 14px 6px;scrollbar-width:none;}
.pp-highlights-row::-webkit-scrollbar{display:none;}
.pp-hl-item{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;width:64px;}
.pp-hl-ring{width:62px;height:62px;border-radius:50%;padding:2.5px;
  background:linear-gradient(135deg,var(--gold),#e8c874,var(--gold-dark));
  transition:transform .15s;}
.pp-hl-item:active .pp-hl-ring{transform:scale(.93);}
.pp-hl-ring-inner{width:100%;height:100%;border-radius:50%;background:var(--cream);padding:2.5px;}
.pp-hl-ring-inner img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;}
.pp-hl-new .pp-hl-ring{background:var(--border);}
.pp-hl-new .pp-hl-ring-inner{display:flex;align-items:center;justify-content:center;background:var(--sand);font-size:1.4rem;color:var(--muted);}
.pp-hl-label{font-size:.66rem;font-weight:600;color:var(--charcoal);text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:64px;}

/* ── Highlight picker modal grid ── */
.pp-hl-picker-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;max-height:260px;overflow-y:auto;}
.pp-hl-pick-cell{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;cursor:pointer;
  border:2.5px solid transparent;background:var(--border);}
.pp-hl-pick-cell.selected{border-color:var(--gold);}
.pp-hl-pick-cell img,.pp-hl-pick-cell video{width:100%;height:100%;object-fit:cover;}
.pp-hl-pick-check{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:var(--gold);
  color:#fff;display:none;align-items:center;justify-content:center;font-size:.65rem;}
.pp-hl-pick-cell.selected .pp-hl-pick-check{display:flex;}

/* ── Quick post composer (owner, top of Posts feed) ── */
.pp-composer{background:var(--sand);border:1px solid var(--border);border-radius:16px;padding:14px;margin:14px;
  box-shadow:0 1px 6px rgba(0,0,0,.04);}
.pp-composer-row{display:flex;align-items:center;gap:10px;cursor:pointer;padding-bottom:12px;margin-bottom:12px;
  border-bottom:1px solid var(--border);}
.pp-composer-avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--navy);flex-shrink:0;}
.pp-composer-input{flex:1;background:var(--cream);border-radius:20px;padding:10px 16px;color:var(--muted);font-size:.85rem;}
.pp-composer-quick{display:flex;gap:8px;}
.pp-composer-qbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 4px;
  border-radius:10px;background:var(--cream);font-size:.75rem;font-weight:700;color:var(--charcoal);cursor:pointer;
  transition:background .15s;}
.pp-composer-qbtn:active{background:var(--border);}

/* ── Mutual follows preview ── */
.pp-mutual-row{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:.76rem;color:var(--muted);}
.pp-mutual-avatars{display:flex;}
.pp-mutual-avatars img{width:20px;height:20px;border-radius:50%;object-fit:cover;border:1.5px solid var(--sand);margin-left:-7px;}
.pp-mutual-avatars img:first-child{margin-left:0;}

.pp-tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--border);margin-top:14px;padding:0 14px;scrollbar-width:none;}
.pp-tabs::-webkit-scrollbar{display:none;}
.pp-tab{padding:12px 14px;font-size:.78rem;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;
  border-bottom:2.5px solid transparent;flex-shrink:0;}
.pp-tab.active{color:var(--gold-dark);border-color:var(--gold);}

/* ── Content grid ── */
.pp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px;}
.pp-grid-item{position:relative;aspect-ratio:1/1;background:var(--border);cursor:pointer;overflow:hidden;}
.pp-grid-item.tall{aspect-ratio:9/14;}
.pp-grid-item img,.pp-grid-item video{width:100%;height:100%;object-fit:cover;display:block;}
.pp-grid-badge{position:absolute;top:6px;right:6px;color:#fff;font-size:.85rem;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));}
.pp-grid-pin{position:absolute;top:6px;left:6px;font-size:.85rem;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));}
.pp-grid-pin-toggle{position:absolute;bottom:6px;right:6px;width:22px;height:22px;border-radius:50%;
  background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:.7rem;cursor:pointer;}
.pp-grid-stat{position:absolute;bottom:6px;left:6px;color:#fff;font-size:.66rem;font-weight:700;background:rgba(0,0,0,.4);
  padding:2px 7px;border-radius:8px;}
.pp-grid-status{position:absolute;top:6px;left:6px;font-size:.6rem;font-weight:800;padding:2px 7px;border-radius:7px;
  background:var(--gold);color:var(--navy);text-transform:uppercase;}

.pp-grid-more{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;
  background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:.9rem;font-weight:900;cursor:pointer;line-height:1;}
/* When a play badge is also present (reel/shorts/video), push it left so
   it doesn't sit under the owner-only ⋮ menu button. */
.pp-grid-badge:has(~ .pp-grid-more){right:30px;}
.pp-content-menu{position:fixed;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.18);
  z-index:700;overflow:hidden;min-width:170px;}
.pp-content-menu-item{padding:12px 16px;font-size:.85rem;font-weight:700;cursor:pointer;color:var(--charcoal);
  border-bottom:1px solid var(--border);}
.pp-content-menu-item:last-child{border-bottom:none;}
.pp-content-menu-item.danger{color:#c0392b;}
.pp-content-menu-backdrop{position:fixed;inset:0;z-index:699;}

.pp-empty{text-align:center;color:var(--muted);font-size:.85rem;padding:60px 20px;}

/* ── TIMELINE TAB — Facebook-style mixed feed, everything this person has
   posted (Post/Reel/Shorts/Video/Story) in one newest-first scroll, each
   still tagged with what type it is. Real ranking logic (follower-weighted,
   engagement-weighted, etc.) is intentionally deferred — see architecture
   discussion — this is newest-first only for now. ── */
.pp-tl-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:12px;cursor:pointer;}
.pp-tl-type-chip{display:inline-block;font-size:.65rem;font-weight:800;padding:2px 9px;border-radius:9px;
  background:var(--cream);color:var(--navy);text-transform:uppercase;margin-bottom:8px;}
.pp-tl-media-row{display:flex;gap:10px;}
.pp-tl-thumb{width:100px;aspect-ratio:1/1;border-radius:10px;object-fit:cover;background:var(--border);flex-shrink:0;position:relative;}
.pp-tl-thumb.tall{aspect-ratio:9/16;}
.pp-tl-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.2rem;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.5));}
.pp-tl-info{flex:1;min-width:0;}
.pp-tl-caption{font-size:.85rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px;}
.pp-tl-meta{font-size:.72rem;color:var(--muted);}
.pp-loading{text-align:center;color:var(--muted);font-size:.85rem;padding:60px 20px;}

/* ── Reviews list ── */
.pp-review{padding:14px 18px;border-bottom:1px solid var(--border);}
.pp-review-stars{color:var(--gold-dark);font-size:.85rem;}
.pp-review-verified{display:inline-flex;align-items:center;gap:3px;font-size:.68rem;font-weight:700;color:var(--green2);
  background:#F1EBD8;padding:2px 8px;border-radius:8px;margin-left:6px;}
.pp-review-text{font-size:.82rem;color:var(--charcoal);margin-top:6px;line-height:1.5;}
.pp-review-meta{font-size:.7rem;color:var(--muted);margin-top:6px;}

/* ── Analytics (owner only) ── */
.pp-analytics-wrap{padding:16px 18px;}
.pp-analytics-note{font-size:.76rem;color:var(--muted);margin-bottom:14px;}
.pp-funnel{display:flex;flex-direction:column;gap:10px;}
.pp-funnel-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;}
.pp-funnel-num{font-size:1.2rem;font-weight:800;color:var(--navy);min-width:64px;}
.pp-funnel-label{font-size:.8rem;color:var(--charcoal);font-weight:600;}
.pp-funnel-sub{font-size:.7rem;color:var(--muted);}

/* ── Modal (Edit Profile / Followers list) ── */
.pp-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:900;align-items:flex-end;justify-content:center;}
.pp-modal-overlay.open{display:flex;}
.pp-modal{background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;max-height:85vh;overflow-y:auto;padding:20px;}
.pp-modal-head{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:14px;}
.pp-form-group{margin-bottom:12px;}
.pp-form-section-label{font-size:.72rem;font-weight:800;color:var(--gold-dark);text-transform:uppercase;
  letter-spacing:.05em;margin:18px 0 8px;padding-top:12px;border-top:1px solid var(--border);}
.pp-form-group label{font-size:.75rem;font-weight:700;display:block;margin-bottom:5px;}
.pp-form-input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:.85rem;font-family:inherit;}
.pp-form-textarea{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:.85rem;font-family:inherit;resize:vertical;}
.pp-modal-save{width:100%;background:var(--navy);color:#fff;border:none;padding:13px;border-radius:22px;font-weight:800;font-size:.85rem;cursor:pointer;margin-top:6px;}
.pp-follow-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.pp-follow-avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--cream);flex-shrink:0;}
.pp-follow-name{font-weight:700;font-size:.85rem;cursor:pointer;flex:1;}

@media(min-width:768px){
  .pp-cover{height:240px;}
  .pp-avatar-wrap{width:120px;height:120px;top:-60px;margin-bottom:-48px;}
  .pp-header,.pp-tabs{max-width:640px;margin:0 auto;}
  .pp-grid{max-width:640px;margin:0 auto;}
}
</style>
</head>
<body>

<div class="pp-nav">
  <button class="pp-nav-btn" onclick="history.length>1?history.back():location.href='media-feed.html?city='+CITY">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="pp-nav-right">
    <button class="pp-nav-btn" onclick="shareProfile()">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12L20 4L14 20L11 13L4 12Z"/></svg>
    </button>
    <button class="pp-nav-btn" onclick="location.href='media-feed.html?city='+CITY" title="DELTA Media Home">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3L21 20H3L12 3Z"/></svg>
    </button>
  </div>
</div>

<div class="pp-cover" id="ppCover">
  <button class="pp-cover-edit" id="ppCoverEditBtn" style="display:none;" onclick="document.getElementById('quickCoverFile').click()">✎ Edit cover</button>
  <input type="file" id="quickCoverFile" accept="image/*" style="display:none;" onchange="handleQuickCoverUpload(this)">
</div>

<div class="pp-header">
  <div class="pp-avatar-wrap">
    <img class="pp-avatar" id="ppAvatarImg" src="" style="display:none;" onerror="this.style.display='none'">
    <div class="pp-avatar-fallback" id="ppAvatarFallback">?</div>
    <div class="pp-avatar-edit" id="ppAvatarEditBtn" style="display:none;" onclick="document.getElementById('quickAvatarFile').click()">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4.5a2 2 0 0 1 3 3L7 18l-4 1 1-4Z"/></svg>
    </div>
    <input type="file" id="quickAvatarFile" accept="image/*" style="display:none;" onchange="handleQuickAvatarUpload(this)">
  </div>

  <div class="pp-name-row">
    <div class="pp-name" id="ppName">লোড হচ্ছে...</div>
    <span class="pp-badge" id="ppBadge" style="display:none;"></span>
  </div>
  <div class="pp-username" id="ppUsername"></div>

  <div class="pp-stats">
    <div class="pp-stat" onclick="switchTab('post')"><b id="ppPostCount">0</b><span>Posts</span></div>
    <div class="pp-stat" onclick="openFollowList('followers')"><b id="ppFollowerCount">0</b><span>Followers</span></div>
    <div class="pp-stat" onclick="openFollowList('following')"><b id="ppFollowingCount">0</b><span>Following</span></div>
  </div>

  <div class="pp-bio" id="ppBio" style="display:none;"></div>
  <div class="pp-meta-row" id="ppMetaRow"></div>
  <div class="pp-link-chips" id="ppLinkChips" style="display:none;"></div>

  <div class="pp-actions" id="ppActions"></div>

  <div class="pp-highlights-row" id="ppHighlightsRow"></div>

  <div class="pp-tabs" id="ppTabs"></div>
</div>

<!-- Highlight picker modal (owner only) — pick one of your own stories
     (even an expired one; the underlying document survives past 24h, only
     the normal feed hides it) to save permanently to your profile. -->
<div class="pp-modal-overlay" id="highlightPickerModal">
  <div class="pp-modal">
    <div class="pp-modal-head">নতুন Highlight <button onclick="closeHighlightPicker()" style="background:none;border:none;font-size:1.1rem;cursor:pointer;">✕</button></div>
    <div class="pp-form-group"><label>Highlight-এর নাম</label><input type="text" class="pp-form-input" id="hlTitleInput" placeholder="যেমন: Bestsellers, Behind the Scenes" maxlength="20"></div>
    <div class="pp-hl-picker-grid" id="hlPickerGrid"><div class="pp-loading" style="padding:20px 0;">আপনার story-গুলো লোড হচ্ছে...</div></div>
    <button class="pp-modal-save" id="hlSaveBtn" onclick="saveHighlight()" disabled>Highlight হিসেবে সেভ করুন</button>
  </div>
</div>

<div id="ppContentArea">
  <div class="pp-loading">লোড হচ্ছে...</div>
</div>

<!-- Edit Profile modal (owner only) -->
<div class="pp-modal-overlay" id="editModal">
  <div class="pp-modal">
    <div class="pp-modal-head">Edit Profile <button onclick="closeEditProfile()" style="background:none;border:none;font-size:1.1rem;cursor:pointer;">✕</button></div>
    <div class="pp-form-group"><label>Display Name</label><input type="text" class="pp-form-input" id="editDisplayName"></div>
    <div class="pp-form-group"><label>Username</label><input type="text" class="pp-form-input" id="editUsername" placeholder="username"></div>
    <div class="pp-form-group"><label>Bio</label><textarea class="pp-form-textarea" id="editBio" rows="3"></textarea></div>
    <div class="pp-form-group">
      <label>Profile ছবি (DP)</label>
      <div id="editAvatarPreviewWrap" style="margin-bottom:8px;"></div>
      <input type="file" id="editAvatarFile" accept="image/*" onchange="handleAvatarUpload(this)">
      <input type="hidden" id="editAvatarUrl">
      <div class="cs-hint" id="editAvatarStatus" style="font-size:.7rem;color:var(--muted);margin-top:4px;"></div>
    </div>
    <div class="pp-form-group">
      <label>Cover ছবি</label>
      <div id="editCoverPreviewWrap" style="margin-bottom:8px;"></div>
      <input type="file" id="editCoverFile" accept="image/*" onchange="handleCoverUpload(this)">
      <input type="hidden" id="editCoverUrl">
      <div class="cs-hint" id="editCoverStatus" style="font-size:.7rem;color:var(--muted);margin-top:4px;"></div>
    </div>

    <div class="pp-form-section-label">External Links</div>
    <div class="pp-form-group"><label>🌐 Website</label><input type="text" class="pp-form-input" id="editWebsite" placeholder="https://..."></div>

var CITY = new URLSearchParams(location.search).get('city') || (function(){ try{ return localStorage.getItem('delta_city'); }catch(e){ return null; } })() || 'manteswar'; // Location Architecture v1 Section 3
// getCityGeo/CITY_GEO_SEED_DEFAULTS/_cmCacheRead/_cmCacheWrite are now
// defined once in delta-shared.js (loaded in <head>), not duplicated here.
var PROFILE_UID = new URLSearchParams(location.search).get('uid');

function requireLogin(){ alert('Login to engage, share and grow.\n\n☰ মেনু থেকে লগইন করুন।'); }

// Self-heal (loadProfile below) previously always assumed the missing
// profile belonged to a customer — an existing SELLER visiting their own
// "আমার DELTA Media" page for the first time would get wrongly created as
// roles:['customer','creator'] with no linkedSellerId at all. This checks
// cities/{city}/sellers/{uid} across every known city (from the small,
// top-level cityConfig collection — same discovery pattern already used in
// index.html/discover-people.html) before falling back to customer shape.
// CITY is checked first as a fast path since most sellers live there today.
async function findSellerAcrossCities(uid){
  try{
    var fast = await db.collection('cities').doc(CITY).collection('sellers').doc(uid).get();
    if(fast.exists) return {city:CITY, data:fast.data()};
    var citySnap = await db.collection('cityConfig').get();
    var otherCities = citySnap.docs.map(function(d){return d.id;}).filter(function(id){return id!==CITY;});
    var results = await Promise.all(otherCities.map(function(c){
      return db.collection('cities').doc(c).collection('sellers').doc(uid).get()
        .then(function(doc){ return {city:c, doc:doc}; })
        .catch(function(){ return {city:c, doc:null}; });
    }));
    var match = results.find(function(r){ return r.doc && r.doc.exists; });
    return match ? {city:match.city, data:match.doc.data()} : null;
  }catch(e){
    console.warn('findSellerAcrossCities failed (non-fatal, falls back to customer shape)', e);
    return null;
  }
}

function expandBio(el){
  var bioEl = document.getElementById('ppBio');
  bioEl.textContent = bioEl.getAttribute('data-full');
}

function renderLinkChips(){
  var wrap = document.getElementById('ppLinkChips');
  var links = profileData.links || {};
  var chips = [];
  if(links.website) chips.push({icon:'🌐', label:hostFromUrl(links.website), url:links.website});
  if(links.youtube) chips.push({icon:'▶️', label:'YouTube', url:links.youtube});
  if(links.facebook) chips.push({icon:'📘', label:'Facebook', url:links.facebook});
  wrap.innerHTML = chips.map(function(c){
    return '<a href="'+c.url+'" target="_blank" class="pp-link-chip">'+c.icon+' '+c.label+'</a>';
  }).join('');
  wrap.style.display = chips.length ? 'flex' : 'none';
}
function hostFromUrl(url){
  try{ return new URL(url).hostname.replace(/^www\./,''); }catch(e){ return 'Website'; }
}

function badgeInfo(p){
  if(p.primaryBadge==='delta_official') return {cls:'official', text:'✓ DELTA Official'};
  if(p.isVerified) return {cls:'verified', text:'✓ Verified'};
  if(p.primaryBadge==='seller' || (p.roles||[]).indexOf('seller')>=0) return {cls:'seller', text:'Seller'};
  if(p.primaryBadge==='service_provider') return {cls:'seller', text:'Service Provider'};
  if(p.primaryBadge==='customer_creator') return {cls:'creator', text:'Creator'};
  return null;
}

async function loadProfile(){
  if(!PROFILE_UID){
    document.getElementById('ppName').textContent = 'কোনো profile পাওয়া যায়নি';
    document.getElementById('ppContentArea').innerHTML = '<div class="pp-empty">এই লিংকে কোনো uid দেওয়া নেই।</div>';
    return;
  }
  try{
    // Global User Identity Architecture v1 — a single top-level lookup.
    // No more guessing which city-tenant the profile might be nested under,
    // and no more 'unassigned'-bucket fallback check: mediaProfiles/{uid}
    // is the ONE place any account's profile lives, regardless of whether
    // DELTA serves their area yet.
    var doc = await db.collection('mediaProfiles').doc(PROFILE_UID).get();
    isOwner = !!(currentUser && currentUser.uid === PROFILE_UID);

    if(!doc.exists && isOwner){
      // Self-heal for accounts created before mediaProfiles auto-creation was
      // added to the sign-up flow — build a basic profile now rather than
      // showing "Profile not found" forever on someone's own page.
      // Check seller FIRST — an existing seller's own shop record is the
      // stronger signal of their real identity than any customer geo guess.
      var sellerMatch = await findSellerAcrossCities(currentUser.uid);
      var basicProfile;
      if(sellerMatch){
        var sd = sellerMatch.data;
        basicProfile = {
          uid: currentUser.uid, displayName: sd.shopName || currentUser.displayName || 'DELTA Seller',
          bio:'', avatarUrl:'', coverUrl:'',
          roles:['seller','creator'], linkedSellerId: currentUser.uid,
          followerCount:0, followingCount:0, postCount:0,
          primaryBadge:'seller', isVerified:false,
          businessCategory: sd.category || null,
          homeCity: sellerMatch.city, areaLabel: sd.area || sellerMatch.city,
          homeCity_lower: sellerMatch.city ? sellerMatch.city.toLowerCase() : null,
          createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()
        };
      } else {
        var isVerified = !!localStorage.getItem('delta_verified_pincode');
        var pendingPincode = isVerified ? null : (localStorage.getItem('delta_last_unserved_pincode') || null);
        var geoFields = {city:null, district:null, state:null, country:null};
        if(isVerified){
          var geo = await getCityGeo(CITY);
          geoFields = {city:CITY, district:geo.district, state:geo.state, country:geo.country};
        }
        basicProfile = {
          uid: currentUser.uid, displayName: currentUser.displayName || 'DELTA User',
          bio:'', avatarUrl:'', coverUrl:'', roles:['customer','creator'],
          linkedCustomerId: currentUser.uid, followerCount:0, followingCount:0, postCount:0,
          primaryBadge:'customer_creator', isVerified:false,
          homeCity:geoFields.city, district:geoFields.district, state:geoFields.state, country:geoFields.country,
          pendingPincode: pendingPincode,
          createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()
        };
      }
      await db.collection('mediaProfiles').doc(PROFILE_UID).set(basicProfile);
      profileData = basicProfile;
    } else {
      profileData = doc.exists ? doc.data() : {};
    }

    // ── Cover & Avatar ──
    if(profileData.coverUrl){
      document.getElementById('ppCover').style.backgroundImage = 'none';
      var img = document.createElement('img'); img.src = profileData.coverUrl;
      document.getElementById('ppCover').prepend(img);
    }
    var avatarImg = document.getElementById('ppAvatarImg'), avatarFallback = document.getElementById('ppAvatarFallback');
    if(profileData.avatarUrl){ avatarImg.src = profileData.avatarUrl; avatarImg.style.display='block'; avatarFallback.style.display='none'; }
    else { avatarFallback.textContent = (profileData.displayName||'?').charAt(0).toUpperCase(); }

    // ── Name, badge, username ──
    document.getElementById('ppName').textContent = profileData.displayName || (doc.exists ? 'Unnamed' : 'প্রোফাইল পাওয়া যায়নি');
    var b = badgeInfo(profileData);
    var badgeEl = document.getElementById('ppBadge');
    if(b){ badgeEl.textContent = b.text; badgeEl.className = 'pp-badge '+b.cls; badgeEl.style.display='inline-flex'; }
    if(profileData.username){ document.getElementById('ppUsername').textContent = '@'+profileData.username; }

    // ── Bio & meta ──
    var bioEl = document.getElementById('ppBio');
    if(profileData.bio){
      var bioText = profileData.bio;
      if(bioText.length > 120){
        bioEl.innerHTML = bioText.slice(0,120)+'... <span class="pp-see-more" onclick="expandBio(this)">আরও দেখুন</span>';
        bioEl.setAttribute('data-full', bioText);
      } else {
        bioEl.textContent = bioText;
      }
      bioEl.style.display='block';
    }
    var metaParts = [];
    // Auto-fetched, verified location — always reflects the real registered
    // area (areaLabel/homeCity). This is the ONLY location shown on the
    // profile now — the separate manual "Location" bio field was removed
    // (Edit Profile) since it was redundant with this auto-fetched, always-
    // accurate value.
    var verifiedLoc = profileData.areaLabel ||
      [profileData.homeCity, profileData.district, profileData.state].filter(Boolean).join(', ');
    if(verifiedLoc){
      metaParts.push('<span style="color:var(--gold,#C9971F);font-weight:700;">📍 '+verifiedLoc+'</span>');
    }
    if(profileData.shopCategory) metaParts.push('🏪 '+profileData.shopCategory);
    if(profileData.establishedYear) metaParts.push('📅 '+profileData.establishedYear+' থেকে');
    if(profileData.businessCategory) metaParts.push('🏷️ '+profileData.businessCategory);
    if(profileData.createdAt){
      var joinYear = new Date(profileData.createdAt).getFullYear();
      metaParts.push('🗓️ '+joinYear+' সাল থেকে DELTA-তে');
    }
    document.getElementById('ppMetaRow').innerHTML = metaParts.map(function(m){ return '<span>'+m+'</span>'; }).join('');

    // ── External links ──
    renderLinkChips();

    // ── Stats ──
    document.getElementById('ppFollowerCount').textContent = (profileData.followerCount||0);
    document.getElementById('ppFollowingCount').textContent = (profileData.followingCount||0);
    loadRealCounts();

    // ── Edit buttons (owner only) ──
    if(isOwner){
      document.getElementById('ppCoverEditBtn').style.display='flex';
      document.getElementById('ppAvatarEditBtn').style.display='flex';
    }

    renderActions();
    renderTabs();
    loadHighlights();
    if(!isOwner && currentUser) loadMutualFollows();

    // Honor ?tab= from hamburger menu links
    if(INITIAL_TAB==='analytics' && isOwner) switchTab('analytics');
    else if(INITIAL_TAB==='saved' && isOwner) switchTab('saved');
    else switchTab('timeline');

  }catch(e){
    console.error('Profile load error', e);
    document.getElementById('ppContentArea').innerHTML = '<div class="pp-empty">প্রোফাইল লোড করতে সমস্যা হয়েছে।</div>';
  }
}

    var following = await base.collection('following').get();
    document.getElementById('ppFollowerCount').textContent = followers.size;
    document.getElementById('ppFollowingCount').textContent = following.size;
    var content = await db.collection('cities').doc(CITY).collection('mediaContent')
      .where('authorUid','==',PROFILE_UID).where('status','==','published').get();
    document.getElementById('ppPostCount').textContent = content.size;
  }catch(e){ console.warn('Count load error', e); }
}

// ═══ STORY HIGHLIGHTS — permanent, curated stories on the profile,
// bypassing the normal 24h expiry (Instagram-style). ═══
var _hlPickedStory = null; // {id, data} of the story chosen in the picker

async function loadHighlights(){
  var wrap = document.getElementById('ppHighlightsRow');
  var html = '';
  if(isOwner){
    html += '<div class="pp-hl-item pp-hl-new" onclick="openHighlightPicker()">'+
      '<div class="pp-hl-ring"><div class="pp-hl-ring-inner">+</div></div>'+
      '<div class="pp-hl-label">নতুন</div></div>';
  }
  try{
    var snap = await db.collection('mediaProfiles').doc(PROFILE_UID).collection('highlights')
      .orderBy('createdAt','desc').limit(20).get();
    snap.forEach(function(doc){
      var h = doc.data();
      html += '<div class="pp-hl-item" onclick="openHighlight(\''+doc.id+'\',\''+h.storyId+'\')">'+
        '<div class="pp-hl-ring"><div class="pp-hl-ring-inner">'+
        (h.coverUrl ? '<img src="'+h.coverUrl+'">' : '<div style="width:100%;height:100%;border-radius:50%;background:var(--navy);"></div>')+
        '</div></div><div class="pp-hl-label">'+(h.title||'Highlight')+'</div></div>';
    });
  }catch(e){ console.warn('Highlights load error (non-fatal)', e); }
  wrap.innerHTML = html;
  wrap.style.display = html ? 'flex' : 'none';
}

function openHighlight(highlightId, storyId){
  // Highlighted stories bypass the normal "last 15 active" story list
  // entirely (that's the whole point — they can be long past their 24h
  // expiry), so this can't reuse the regular ?openStoryId= deep-link path,
  // which only searches among currently-active stories. media-feed.html
  // fetches this ID directly by document reference instead.
  location.href = 'media-feed.html?city='+CITY+'&openHighlightStoryId='+storyId;
}

async function openHighlightPicker(){
  document.getElementById('highlightPickerModal').classList.add('open');
  document.getElementById('hlTitleInput').value = '';
  _hlPickedStory = null;
  document.getElementById('hlSaveBtn').disabled = true;
  var grid = document.getElementById('hlPickerGrid');
  grid.innerHTML = '<div class="pp-loading" style="padding:20px 0;">আপনার story-গুলো লোড হচ্ছে...</div>';
  try{
    // Deliberately no status/expiresAt filter — highlights exist precisely
    // to rescue a story that would otherwise be gone from the normal feed,
    // so owner needs to see ALL of their own stories here, expired or not.
    var snap = await db.collection('cities').doc(CITY).collection('mediaContent')
      .where('authorUid','==',PROFILE_UID).where('type','==','story')
      .orderBy('createdAt','desc').limit(30).get();
    if(snap.empty){ grid.innerHTML = '<div class="pp-empty" style="padding:20px 0;">এখনো কোনো story তৈরি করেননি।</div>'; return; }
    var cells = [];
    snap.forEach(function(doc){
      var d = doc.data();
      var thumb = d.mediaUrls && d.mediaUrls[0];
      cells.push('<div class="pp-hl-pick-cell" data-id="'+doc.id+'" onclick=\'pickHlStory(this,'+JSON.stringify(JSON.stringify({id:doc.id,thumb:thumb||null,video:d.videoUrl||null}))+')\'>'+
        (thumb ? '<img src="'+thumb+'">' : (d.videoUrl ? '<video src="'+d.videoUrl+'" muted></video>' : ''))+
        '<div class="pp-hl-pick-check">✓</div></div>');
    });
    grid.innerHTML = cells.join('');
  }catch(e){
    console.error('Highlight picker load error', e);
    grid.innerHTML = '<div class="pp-empty" style="padding:20px 0;">লোড করতে সমস্যা হয়েছে।</div>';
  }
}
function pickHlStory(el, payloadJson){
  document.querySelectorAll('.pp-hl-pick-cell').forEach(function(c){ c.classList.remove('selected'); });
  el.classList.add('selected');
  _hlPickedStory = JSON.parse(payloadJson);
  document.getElementById('hlSaveBtn').disabled = false;
}
function closeHighlightPicker(){
  document.getElementById('highlightPickerModal').classList.remove('open');
}
async function saveHighlight(){
  var title = document.getElementById('hlTitleInput').value.trim();
  if(!title || !_hlPickedStory) return;
  var btn = document.getElementById('hlSaveBtn');
  btn.disabled = true; btn.textContent = 'সেভ হচ্ছে...';
  try{
    await db.collection('mediaProfiles').doc(PROFILE_UID).collection('highlights').add({
      title: title, storyId: _hlPickedStory.id,
      coverUrl: _hlPickedStory.thumb || null,
      createdAt: new Date().toISOString()
    });
    closeHighlightPicker();
    loadHighlights();
  }catch(e){
    alert('Highlight সেভ করতে সমস্যা হয়েছে: '+e.message);
  }
  btn.disabled = false; btn.textContent = 'Highlight হিসেবে সেভ করুন';
}

// ═══ MUTUAL FOLLOWS PREVIEW (shown only when viewing someone else's profile) ═══
async function loadMutualFollows(){
  try{
    var myFollowingSnap = await db.collection('mediaProfiles').doc(currentUser.uid).collection('following').limit(200).get();
    if(myFollowingSnap.empty) return;
    var myFollowingIds = myFollowingSnap.docs.map(function(d){ return d.id; });
    var theirFollowersSnap = await db.collection('mediaProfiles').doc(PROFILE_UID).collection('followers').limit(200).get();
    var theirFollowerIds = {}; theirFollowersSnap.forEach(function(d){ theirFollowerIds[d.id]=true; });
    var mutualIds = myFollowingIds.filter(function(id){ return theirFollowerIds[id]; });
    if(!mutualIds.length) return;
    var previewIds = mutualIds.slice(0,3);
    var profiles = await Promise.all(previewIds.map(function(id){
      return db.collection('mediaProfiles').doc(id).get();
    }));
    var names = profiles.map(function(p){ return p.exists ? (p.data().displayName||'কেউ একজন') : 'কেউ একজন'; });
    var avatarHtml = profiles.map(function(p){
      var a = p.exists ? p.data().avatarUrl : '';
      return a ? '<img src="'+a+'">' : '<img src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%2712%27 fill=%27%23141414%27/%3E%3C/svg%3E">';
    }).join('');
    var extra = mutualIds.length - previewIds.length;
    var text = names.join(', ') + (extra>0 ? ' এবং আরও '+extra+' জন' : '') + ' follow করেন';
    var row = document.createElement('div');
    row.className = 'pp-mutual-row';
    row.innerHTML = '<span class="pp-mutual-avatars">'+avatarHtml+'</span><span>'+text+'</span>';
    document.getElementById('ppMetaRow').after(row);
  }catch(e){ console.warn('Mutual follows load error (non-fatal)', e); }
}

function renderActions(){
  var wrap = document.getElementById('ppActions');
  wrap.innerHTML = '';
  if(isOwner){
    wrap.innerHTML =
      '<button class="pp-btn pp-btn-primary" onclick="openEditProfile()">Edit Profile</button>'+
      '<button class="pp-btn pp-btn-secondary" onclick="switchTab(\'analytics\')">📊 Analytics</button>';
    return;
  }
  var isSeller = profileData.primaryBadge==='seller' || (profileData.roles||[]).indexOf('seller')>=0;

  followBtn.onclick = toggleFollowProfile;
  wrap.appendChild(followBtn);
  if(isSeller && profileData.linkedSellerId){
    var shopBtn = document.createElement('button');
    shopBtn.className = 'pp-btn pp-btn-secondary'; shopBtn.textContent = '🏪 Visit Shop';
    shopBtn.onclick = function(){ location.href='shop.html?id='+profileData.linkedSellerId+'&city='+CITY; };
    wrap.appendChild(shopBtn);
  }
  var shareBtn = document.createElement('div');
  shareBtn.className = 'pp-btn-icon'; shareBtn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12L20 4L14 20L11 13L4 12Z"/></svg>';
  shareBtn.onclick = shareProfile;
  wrap.appendChild(shareBtn);
  refreshFollowBtnState();
}

async function refreshFollowBtnState(){
  if(!currentUser || isOwner) return;
  try{
    var d = await db.collection('mediaProfiles').doc(currentUser.uid).collection('following').doc(PROFILE_UID).get();
    var btn = document.getElementById('ppFollowBtn');
    if(btn && d.exists){ btn.textContent = 'Following'; btn.classList.add('following'); }
  }catch(e){}
}
function toggleFollowProfile(){
  if(!currentUser){ requireLogin(); return; }
  var btn = document.getElementById('ppFollowBtn');
  var myRef = db.collection('mediaProfiles').doc(currentUser.uid).collection('following').doc(PROFILE_UID);
  var theirRef = db.collection('mediaProfiles').doc(PROFILE_UID).collection('followers').doc(currentUser.uid);
  var isFollowing = btn.classList.contains('following');
  if(isFollowing){
    myRef.delete(); theirRef.delete();
    btn.textContent='Follow'; btn.classList.remove('following');
  } else {
    myRef.set({followedAt:new Date().toISOString()});
    theirRef.set({followedAt:new Date().toISOString()});
    btn.textContent='Following'; btn.classList.add('following');
  }
  loadRealCounts();
}

function renderTabs(){
  var tabs = [
    {id:'timeline', label:'সব'},
    {id:'post', label:'Posts'},
    {id:'reel', label:'Reels'},
    {id:'shorts', label:'Shorts'},
    {id:'story', label:'Stories'},
    {id:'video', label:'Videos'},
    {id:'reviews', label:'Reviews'}
  ];
  if(isOwner) tabs.push({id:'saved', label:'Saved'});
  var wrap = document.getElementById('ppTabs');
  wrap.innerHTML = tabs.map(function(t){
    return '<div class="pp-tab" id="ppTab-'+t.id+'" onclick="switchTab(\''+t.id+'\')">'+t.label+'</div>';
  }).join('');
}

function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('.pp-tab').forEach(function(el){ el.classList.remove('active'); });
  var activeEl = document.getElementById('ppTab-'+tab);
  if(activeEl) activeEl.classList.add('active');
  var area = document.getElementById('ppContentArea');
  area.innerHTML = '<div class="pp-loading">লোড হচ্ছে...</div>';

  if(tab==='analytics') return renderAnalytics();
  if(tab==='saved') return renderSavedPlaceholder();
  if(tab==='reviews') return loadReviews();
  if(tab==='timeline') return loadTimelineFeed();
  loadContentGrid(tab);
}

async function changeExistingThumbnail(contentId, inputEl){
  var file = inputEl.files[0];

  try{
    var compressedThumbFile = await deltaCompressImage(file);
    var fd = new FormData();
    fd.append('file', compressedThumbFile); fd.append('upload_preset', PRESET); fd.append('cloud_name', CLOUD);

      .update({thumbnailUrl: data.secure_url});

// ── Timeline tab — Facebook-style "everything this person made" mixed
// feed. Firestore's 'in' operator lets us fetch post/reel/video/story in
// ONE query (well under its 10-value cap) instead of 4 separate round
// trips. Live isn't in this list yet since that section doesn't exist.
async function loadTimelineFeed(){
  var area = document.getElementById('ppContentArea');
  area.innerHTML = '<div class="pp-loading">লোড হচ্ছে...</div>';
  try{
    var snap = await db.collection('cities').doc(CITY).collection('mediaContent')
      .where('authorUid','==',PROFILE_UID)
      .where('type','in',['post','reel','video','story'])
      .get();
    var docs = snap.docs.map(function(d){ return {id:d.id, data:d.data()}; })
      .filter(function(item){ return item.data.status==='published' || isOwner; })
      .sort(function(a,b){ return new Date(b.data.createdAt) - new Date(a.data.createdAt); }); // newest-first only for now — real ranking logic deferred

    if(!docs.length){
      area.innerHTML = '<div class="pp-empty">এখনও কিছু তৈরি করা হয়নি।'+(isOwner?'<br>Create Studio থেকে প্রথমটা বানিয়ে ফেলো।':'')+'</div>';
      return;
    }
    area.innerHTML = '';

  }catch(e){

    area.innerHTML = '<div class="pp-empty">লোড করতে সমস্যা হয়েছে — সম্ভবত Firestore index তৈরি করা লাগবে।</div>';
  }
}

function buildTimelineCard(item){
  var d = item.data;
  var isShorts = d.type==='reel' && d.createdFrom==='video_hub';
  var typeLabel = d.type==='post' ? 'Post' : d.type==='story' ? 'Story' : d.type==='video' ? 'Video' : isShorts ? 'Shorts' : 'Reel';
  var card = document.createElement('div'); card.className = 'pp-tl-card';
  var thumb = d.thumbnailUrl || (d.mediaUrls && d.mediaUrls[0]) || '';
  var hasMedia = d.type !== 'post' || thumb;
  card.innerHTML =
    '<div class="pp-tl-type-chip">'+typeLabel+'</div>'+
    '<div class="pp-tl-media-row">'+
      (hasMedia ? '<div class="pp-tl-thumb'+((d.type==='reel'||d.type==='story')?' tall':'')+'">'+
        (thumb ? '<img src="'+thumb+'" style="width:100%;height:100%;object-fit:cover;border-radius:10px;">' : '')+
        (d.type!=='post' ? '<span class="pp-tl-play">▶</span>' : '')+
      '</div>' : '')+
      '<div class="pp-tl-info">'+
        (d.caption ? '<div class="pp-tl-caption">'+(d.videoTitle||d.caption)+'</div>' : '')+
        '<div class="pp-tl-meta">👁 '+((d.stats&&d.stats.views)||0)+' · '+timeAgo(d.createdAt)+
        (isOwner && d.status!=='published' ? ' · <b>'+d.status+'</b>' : '')+'</div>'+
      '</div>'+
    '</div>';
  card.onclick = function(){
    if(d.type==='reel' && !isShorts) location.href='reels-player.html?city='+CITY+'&id='+item.id;
    else if(isShorts || d.type==='video') location.href='video-hub.html?city='+CITY+'&id='+item.id;
    else if(d.type==='story') location.href='media-feed.html?city='+CITY+'&openStoryId='+item.id;
    else openPostDetailOverlay(item.id, d);
  };
  return card;
}

async function loadContentGrid(type){
  var area = document.getElementById('ppContentArea');
  var composerHtml = (type==='post' && isOwner) ? buildComposerHtml() : '';
  try{
    // "Shorts" isn't its own Firestore type — it's type=='reel' made from
    // DELTA Video's own + button (createdFrom=='video_hub'). Query by the
    // real type field, then split client-side so Reels and Shorts tabs
    // never show each other's content, matching reels-player.html's own
    // exclusion and video-hub.html's own inclusion of the same field.
    var queryType = (type === 'shorts') ? 'reel' : type;
    var q = db.collection('cities').doc(CITY).collection('mediaContent')
      .where('authorUid','==',PROFILE_UID).where('type','==',queryType);
    var snap = await q.get();
    var docs = snap.docs.map(function(d){ return {id:d.id, data:d.data()}; })
      .filter(function(item){
        if(item.data.status==='published') return true;
        return isOwner; // owner also sees their own draft/pending
      })
      .filter(function(item){
        if(queryType !== 'reel') return true; // split only matters for reel/shorts
        var isFromVideoHub = item.data.createdFrom === 'video_hub';
        return type === 'shorts' ? isFromVideoHub : !isFromVideoHub;
      })
      .sort(function(a,b){
        // Pinned post always first (Post tab only — pinning a reel/video/
        // story doesn't carry the same meaning), then newest-first.
        if(type==='post'){
          var aPinned = a.id===profileData.pinnedPostId, bPinned = b.id===profileData.pinnedPostId;
          if(aPinned && !bPinned) return -1;
          if(bPinned && !aPinned) return 1;
        }
        return new Date(b.data.createdAt) - new Date(a.data.createdAt);
      });

    if(!docs.length){
      area.innerHTML = composerHtml+'<div class="pp-empty">এখানে এখনও কোনো '+type+' নেই।'+(isOwner?'<br>নিচে থেকে বা Create Studio থেকে প্রথমটা বানিয়ে ফেলো।':'')+'</div>';
      return;
    }
    var grid = document.createElement('div'); grid.className = 'pp-grid';
    docs.forEach(function(item){
      var d = item.data;
      var isPinned = type==='post' && item.id===profileData.pinnedPostId;
      var cell = document.createElement('div');
      cell.className = 'pp-grid-item' + ((type==='reel'||type==='shorts'||type==='story') ? ' tall' : '');
      // thumbnailUrl first, then a real image, then fall back to showing the
      // video itself (muted, first frame) — previously this only checked
      // thumbnailUrl/mediaUrls, leaving video-only stories/reels/videos with
      // a blank cell since videoUrl was never considered at all.
      var thumb = d.thumbnailUrl || (d.mediaUrls && d.mediaUrls[0]) || '';
      cell.innerHTML =
        (thumb ? '<img src="'+thumb+'" onerror="this.style.display=\'none\'">'
          : (d.videoUrl ? '<video src="'+d.videoUrl+'" muted playsinline preload="metadata"></video>' : ''))+
        ((type==='reel'||type==='shorts'||type==='video') ? '<span class="pp-grid-badge">▶</span>' : '')+
        (isPinned ? '<span class="pp-grid-pin">📌</span>' : '')+
        (d.stats ? '<span class="pp-grid-stat">👁 '+(d.stats.views||0)+'</span>' : '')+
        (isOwner && d.status!=='published' ? '<span class="pp-grid-status">'+d.status+'</span>' : '')+
        (isOwner && type==='post' ? '<span class="pp-grid-pin-toggle" onclick="event.stopPropagation();togglePinPost(\''+item.id+'\')">'+(isPinned?'📌':'📍')+'</span>' : '')+
        (isOwner && (type==='reel'||type==='shorts'||type==='video') ? '<span class="pp-grid-pin-toggle" style="right:auto;left:6px;" onclick="event.stopPropagation();document.getElementById(\'thumbEdit-'+item.id+'\').click()">✏️</span>'
          +'<input type="file" id="thumbEdit-'+item.id+'" accept="image/*" style="display:none;" onclick="event.stopPropagation()" onchange="event.stopPropagation();changeExistingThumbnail(\''+item.id+'\', this)">' : '')+
        (isOwner ? '<span class="pp-grid-more" onclick="event.stopPropagation();openContentMenu(\''+item.id+'\',\''+type+'\',this)">⋮</span>' : '');
      cell.onclick = function(){
        // Deep-link with the specific content ID so the destination page can
        // actually open/play THIS item — a bare redirect to the generic hub
        // page (previous behaviour) never played anything, it just landed
        // on the default feed.
        if(type==='reel') location.href='reels-player.html?city='+CITY+'&id='+item.id;
        else if(type==='shorts'||type==='video') location.href='video-hub.html?city='+CITY+'&id='+item.id;
        else if(type==='story') location.href='media-feed.html?city='+CITY+'&openStoryId='+item.id;
        else openPostDetailOverlay(item.id, item.data); // Posts open right here, same as Facebook — no redirect to the feed at all
      };
      grid.appendChild(cell);
    });
    area.innerHTML = composerHtml; area.appendChild(grid);
  }catch(e){
    console.warn('Content grid load error (likely missing composite index)', e);
    area.innerHTML = '<div class="pp-empty">লোড করতে সমস্যা হয়েছে — সম্ভবত Firestore index তৈরি করা লাগবে।</div>';
  }
}

// ── Owner-only content menu (⋮) — Archive vs Delete, per the Soft Delete
// Policy already documented in the Master Doc (§8.3) but never wired up to
// any UI until now:
//   Archive → status:'archived' — stays with the author, just hidden from
//             public view; can't be un-archived from here yet (that's a
//             reasonable next step, not blocking this one).
//   Delete  → permanently removed. Confirmed twice given it's irreversible;
//             likes/comments subcollections are intentionally left behind
//             (Firestore doesn't cascade-delete) — orphaned but harmless,
//             a Cloud Function cleanup is the correct long-term fix, not a
//             client-side recursive delete.
function openContentMenu(contentId, type, el){
  closeContentMenu();
  var rect = el.getBoundingClientRect();
  var backdrop = document.createElement('div');
  backdrop.className = 'pp-content-menu-backdrop';
  backdrop.id = 'ppContentMenuBackdrop';
  backdrop.onclick = closeContentMenu;
  var menu = document.createElement('div');
  menu.className = 'pp-content-menu';
  menu.id = 'ppContentMenu';
  var top = Math.min(rect.bottom + 4, window.innerHeight - 110);
  var left = Math.min(rect.left, window.innerWidth - 180);
  menu.style.top = top + 'px';
  menu.style.left = left + 'px';
  menu.innerHTML =
    '<div class="pp-content-menu-item" onclick="archiveContent(\''+contentId+'\',\''+type+'\')">🗄 আর্কাইভ করুন</div>'+
    '<div class="pp-content-menu-item danger" onclick="deleteContent(\''+contentId+'\',\''+type+'\')">🗑 মুছে ফেলুন</div>';
  document.body.appendChild(backdrop);
  document.body.appendChild(menu);
}
function closeContentMenu(){
  var m = document.getElementById('ppContentMenu'); if(m) m.remove();
  var b = document.getElementById('ppContentMenuBackdrop'); if(b) b.remove();
}
async function archiveContent(contentId, type){
  closeContentMenu();
  if(!confirm('এই content-টা আর্কাইভ করবেন? এটা আর কেউ public-এ দেখতে পাবে না, কিন্তু আপনার প্রোফাইলে থেকে যাবে।')) return;
  try{
    await db.collection('cities').doc(CITY).collection('mediaContent').doc(contentId).update({status:'archived'});
    loadContentGrid(type);
  }catch(e){ alert('Error: '+e.message); }
}
async function deleteContent(contentId, type){
  closeContentMenu();
  if(!confirm('এই content-টা স্থায়ীভাবে মুছে ফেলতে চান? এটা আর ফিরিয়ে আনা যাবে না।')) return;
  if(!confirm('নিশ্চিত? এটাই শেষ নিশ্চিতকরণ — মুছে ফেলা হবে।')) return;
  try{
    await db.collection('cities').doc(CITY).collection('mediaContent').doc(contentId).delete();
    loadContentGrid(type);
  }catch(e){ alert('Error: '+e.message); }
}

function timeAgo(iso){
  if(!iso) return '';
  var diff = (Date.now() - new Date(iso).getTime())/1000;
  if(diff<60) return 'এইমাত্র';
  if(diff<3600) return Math.floor(diff/60)+' মিনিট আগে';
  if(diff<86400) return Math.floor(diff/3600)+' ঘণ্টা আগে';
  return Math.floor(diff/86400)+' দিন আগে';
}

  else { navigator.clipboard.writeText(url).then(function(){ alert('Link copied!'); }).catch(function(){ alert(url); }); }

// ── QUICK avatar/cover upload — tapping the pencil/edit icon directly on
// the photo itself uploads AND saves immediately, no need to open the full
// Edit Profile modal first. The modal's own upload fields (above) remain
// for when someone's already in there editing other things too. ──
async function handleQuickAvatarUpload(input){
  var file = input.files[0];
  input.value = '';
  if(!file || !currentUser) return;
  if(file.size > 10*1024*1024){ alert('ছবি সর্বোচ্চ 10MB হতে পারবে'); return; }
  try{
    var compressedAvatar = await deltaCompressImage(file, 800);
    var fd = new FormData();
    fd.append('file', compressedAvatar); fd.append('upload_preset', PRESET); fd.append('cloud_name', CLOUD);
    fd.append('folder', 'delta/profile_images');
    var res = await fetch('https://api.cloudinary.com/v1_1/'+CLOUD+'/image/upload', {method:'POST', body:fd});
    var data = await res.json();
    if(!data.secure_url) throw new Error(data.error ? data.error.message : 'Upload failed');
    await db.collection('mediaProfiles').doc(currentUser.uid).set({avatarUrl:data.secure_url, updatedAt:new Date().toISOString()}, {merge:true});
    profileData.avatarUrl = data.secure_url;
    document.getElementById('ppAvatarImg').src = data.secure_url;
    document.getElementById('ppAvatarImg').style.display = 'block';
    document.getElementById('ppAvatarFallback').style.display = 'none';
  }catch(e){
    alert('Profile ছবি আপডেট করতে সমস্যা হয়েছে: '+e.message);
  }
}

// ── Direct image upload (no Cloudinary account needed — uses DELTA's own,
// same as every other upload in the app). Replaces what used to be a raw
// "paste an image URL" field, which assumed the person already had the
// image hosted somewhere themselves. ──
async function handleAvatarUpload(input){
  var file = input.files[0];
  if(!file) return;
  await uploadEditImage(file, 'editAvatarUrl', 'editAvatarStatus', 'editAvatarPreviewWrap', true);
}
async function handleCoverUpload(input){
  var file = input.files[0];
  if(!file) return;
  await uploadEditImage(file, 'editCoverUrl', 'editCoverStatus', 'editCoverPreviewWrap', false);
}
async function uploadEditImage(file, urlFieldId, statusId, previewId, isCircle){
  if(file.size > 10*1024*1024){ document.getElementById(statusId).textContent = 'ছবি সর্বোচ্চ 10MB হতে পারবে ⚠️'; return; }
  document.getElementById(statusId).textContent = 'আপলোড হচ্ছে...';
  try{
    var compressedEditImg = await deltaCompressImage(file, isCircle ? 800 : 1600);
    var fd = new FormData();
    fd.append('file', compressedEditImg); fd.append('upload_preset', PRESET); fd.append('cloud_name', CLOUD);
    fd.append('folder', 'delta/profile_images');
    var res = await fetch('https://api.cloudinary.com/v1_1/'+CLOUD+'/image/upload', {method:'POST', body:fd});
    var data = await res.json();
    if(data.secure_url){
      document.getElementById(urlFieldId).value = data.secure_url;
      var style = isCircle ? 'width:64px;height:64px;border-radius:50%;object-fit:cover;'
        : 'width:100%;max-height:100px;object-fit:cover;border-radius:8px;';
      document.getElementById(previewId).innerHTML = '<img src="'+data.secure_url+'" style="'+style+'">';
      document.getElementById(statusId).textContent = '✅ আপলোড সম্পন্ন';
    } else {
      throw new Error(data.error ? data.error.message : 'Upload failed');
    }
  }catch(e){
    document.getElementById(statusId).textContent = 'আপলোড ব্যর্থ: '+e.message;
  }
}

// ── Edit Profile ──
function openEditProfile(){
  document.getElementById('editDisplayName').value = profileData.displayName || '';
  document.getElementById('editUsername').value = profileData.username || '';
  document.getElementById('editBio').value = profileData.bio || '';
  document.getElementById('editAvatarUrl').value = profileData.avatarUrl || '';
  document.getElementById('editCoverUrl').value = profileData.coverUrl || '';
  document.getElementById('editAvatarFile').value = '';
  document.getElementById('editCoverFile').value = '';
  document.getElementById('editAvatarStatus').textContent = '';
  document.getElementById('editCoverStatus').textContent = '';
  document.getElementById('editAvatarPreviewWrap').innerHTML = profileData.avatarUrl
    ? '<img src="'+profileData.avatarUrl+'" style="width:64px;height:64px;border-radius:50%;object-fit:cover;">' : '';
  document.getElementById('editCoverPreviewWrap').innerHTML = profileData.coverUrl
    ? '<img src="'+profileData.coverUrl+'" style="width:100%;max-height:100px;object-fit:cover;border-radius:8px;">' : '';
  var links = profileData.links || {};
  document.getElementById('editWebsite').value = links.website || '';
  document.getElementById('editYoutube').value = links.youtube || '';
  document.getElementById('editFacebook').value = links.facebook || '';
  var isSeller = profileData.primaryBadge==='seller' || (profileData.roles||[]).indexOf('seller')>=0;
  document.getElementById('editBusinessLabel').style.display = isSeller ? 'block' : 'none';
  document.getElementById('editShopCategoryWrap').style.display = isSeller ? 'block' : 'none';
  document.getElementById('editEstablishedWrap').style.display = isSeller ? 'block' : 'none';
  if(isSeller){
    document.getElementById('editShopCategory').value = profileData.shopCategory || '';
    document.getElementById('editEstablishedYear').value = profileData.establishedYear || '';
  }
  document.getElementById('editModal').classList.add('open');
}
function closeEditProfile(){ document.getElementById('editModal').classList.remove('open'); }
async function saveProfileEdit(){
  if(!currentUser){ requireLogin(); return; }
  var updates = {
    displayName: document.getElementById('editDisplayName').value.trim(),
    username: document.getElementById('editUsername').value.trim().replace(/^@/,''),
    bio: document.getElementById('editBio').value.trim(),
    avatarUrl: document.getElementById('editAvatarUrl').value.trim(),
    coverUrl: document.getElementById('editCoverUrl').value.trim(),
    links: {
      website: document.getElementById('editWebsite').value.trim(),
      youtube: document.getElementById('editYoutube').value.trim(),
      facebook: document.getElementById('editFacebook').value.trim()
    },
    updatedAt: new Date().toISOString()
  };
  var isSeller = profileData.primaryBadge==='seller' || (profileData.roles||[]).indexOf('seller')>=0;
  if(isSeller){
    updates.shopCategory = document.getElementById('editShopCategory').value.trim();
    updates.establishedYear = document.getElementById('editEstablishedYear').value.trim();
  }
  try{
    await db.collection('mediaProfiles').doc(currentUser.uid).set(updates, {merge:true});
    closeEditProfile();
    profileData = Object.assign({}, profileData, updates);
    loadProfile();
  }catch(e){
    alert('Save করতে সমস্যা হয়েছে: '+e.message);
  }
}

// ── Followers/Following list ──
function openFollowList(kind){
  document.getElementById('followListTitle').textContent = kind==='followers' ? 'Followers' : 'Following';
  document.getElementById('followListModal').classList.add('open');
  document.getElementById('followListBody').innerHTML = '<div class="pp-loading">লোড হচ্ছে...</div>';
  db.collection('mediaProfiles').doc(PROFILE_UID).collection(kind).limit(50).get()
    .then(async function(snap){
      if(!snap.docs.length){ document.getElementById('followListBody').innerHTML = '<div class="pp-empty">কেউ নেই এখনো।</div>'; return; }
      var rows = await Promise.all(snap.docs.map(async function(d){
        var pDoc = await db.collection('mediaProfiles').doc(d.id).get();
        var p = pDoc.exists ? pDoc.data() : {};
        return '<div class="pp-follow-row"><img class="pp-follow-avatar" src="'+(p.avatarUrl||'')+'" onerror="this.style.background=\'var(--cream)\'">'+
          '<div class="pp-follow-name" onclick="location.href=\'media-profile.html?uid='+d.id+'&city='+CITY+'\'">'+(p.displayName||'Unknown')+'</div></div>';
      }));
      document.getElementById('followListBody').innerHTML = rows.join('');
    }).catch(function(e){
      console.warn('Follow list error', e);
      document.getElementById('followListBody').innerHTML = '<div class="pp-empty">লোড করতে সমস্যা হয়েছে।</div>';
    });
}
function closeFollowList(){ document.getElementById('followListModal').classList.remove('open'); }

// ═══ POST DETAIL OVERLAY — Facebook-style: view a post right from your
// profile, no redirect to the feed at all. Reuses the exact same
// likes/comments subcollections the feed already writes to. ═══
function closePostDetailOverlay(){
  document.getElementById('postDetailOverlay').style.display = 'none';
  document.getElementById('postDetailBody').innerHTML = '';
}
async function openPostDetailOverlay(id, d){
  var overlay = document.getElementById('postDetailOverlay');
  var body = document.getElementById('postDetailBody');
  overlay.style.display = 'block';
  body.innerHTML = '<div class="pp-loading" style="padding:30px;">লোড হচ্ছে...</div>';
  window.scrollTo(0,0);

  var mediaHtml = '';
  if(d.videoUrl) mediaHtml = '<video src="'+d.videoUrl+'" controls playsinline style="width:100%;max-height:520px;object-fit:cover;display:block;"></video>';
  else if(d.mediaUrls && d.mediaUrls.length) mediaHtml = '<img src="'+d.mediaUrls[0]+'" style="width:100%;display:block;">';

  var avatarUrl = profileData.avatarUrl || '';
  var initial = (profileData.displayName||'?').charAt(0).toUpperCase();

  body.innerHTML =
    '<div style="background:var(--white);">'+
      '<div style="display:flex;align-items:center;gap:10px;padding:14px 14px 10px;">'+
        (avatarUrl ? '<img src="'+avatarUrl+'" style="width:40px;height:40px;border-radius:50%;object-fit:cover;">'
          : '<div style="width:40px;height:40px;border-radius:50%;background:var(--sand);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--navy);">'+initial+'</div>')+
        '<div><div style="font-weight:800;font-size:.87rem;">'+(profileData.displayName||'Unknown')+'</div>'+
        '<div style="font-size:.7rem;color:var(--muted);">'+timeAgo(d.createdAt)+'</div></div>'+
      '</div>'+
      (d.caption ? '<div style="padding:2px 14px 12px;font-size:.86rem;line-height:1.55;white-space:pre-wrap;">'+d.caption+'</div>' : '')+
      mediaHtml+
      '<div style="display:flex;align-items:center;gap:20px;padding:10px 14px;border-top:1px solid var(--border);">'+
        '<button id="pdLikeBtn" onclick="pdToggleLike(\''+id+'\')" style="background:none;border:none;display:flex;align-items:center;gap:5px;font-size:.85rem;font-weight:700;cursor:pointer;">'+
          '<span id="pdLikeIcon">🤍</span> <span id="pdLikeCount">0</span></button>'+
        '<div style="display:flex;align-items:center;gap:5px;font-size:.85rem;font-weight:700;">💬 <span id="pdCommentCount">0</span></div>'+
      '</div>'+
    '</div>'+
    '<div id="pdCommentsList" style="padding:12px 14px;display:flex;flex-direction:column;gap:12px;"></div>'+
    '<div style="display:flex;gap:8px;padding:12px 14px;background:var(--white);border-top:1px solid var(--border);position:sticky;bottom:0;">'+
      '<input type="text" id="pdCommentInput" placeholder="একটা মন্তব্য লিখুন..." style="flex:1;padding:9px 14px;border-radius:20px;border:1.5px solid var(--border);">'+
      '<button onclick="pdSendComment(\''+id+'\')" style="background:var(--navy);color:#fff;border:none;padding:0 16px;border-radius:20px;font-weight:700;cursor:pointer;">Send</button>'+
    '</div>';

  pdLoadLikeState(id);
  pdLoadComments(id);
}
function pdMc(id){ return db.collection('cities').doc(CITY).collection('mediaContent').doc(id); }
async function pdLoadLikeState(id){
  try{
    var likesSnap = await pdMc(id).collection('likes').get();
    document.getElementById('pdLikeCount').textContent = likesSnap.size;
    if(currentUser){
      var mine = await pdMc(id).collection('likes').doc(currentUser.uid).get();
      document.getElementById('pdLikeIcon').textContent = mine.exists ? '❤️' : '🤍';
    }
  }catch(e){ console.warn('Post detail like load error', e); }
}
async function pdToggleLike(id){
  if(!currentUser){ requireLogin(); return; }
  var ref = pdMc(id).collection('likes').doc(currentUser.uid);
  var existing = await ref.get();
  if(existing.exists) await ref.delete(); else await ref.set({likedAt:new Date().toISOString()});
  pdLoadLikeState(id);
}
async function pdLoadComments(id){
  var wrap = document.getElementById('pdCommentsList');
  try{
    var snap = await pdMc(id).collection('comments').orderBy('createdAt','desc').limit(50).get();
    document.getElementById('pdCommentCount').textContent = snap.size;
    if(snap.empty){ wrap.innerHTML = '<div style="color:var(--muted);font-size:.8rem;text-align:center;padding:10px 0;">এখনো কোনো মন্তব্য নেই।</div>'; return; }
    wrap.innerHTML = snap.docs.map(function(doc){
      var c = doc.data();
      return '<div><b style="font-size:.82rem;">'+(c.authorName||'Unknown')+'</b> '+
        '<span style="font-size:.82rem;">'+(c.text||'')+'</span></div>';
    }).join('');
  }catch(e){
    console.warn('Post detail comments load error', e);
    wrap.innerHTML = '<div style="color:var(--muted);font-size:.8rem;">মন্তব্য লোড করা যাচ্ছে না।</div>';
  }
}
async function pdSendComment(id){
  if(!currentUser){ requireLogin(); return; }
  var input = document.getElementById('pdCommentInput');
  var text = input.value.trim();
  if(!text) return;
  input.value = '';
  try{
    // profileData is the PROFILE BEING VIEWED, not necessarily the person
    // typing this comment — fetch the actual commenter's own name instead.
    var myDoc = await db.collection('mediaProfiles').doc(currentUser.uid).get();
    var myName = myDoc.exists ? (myDoc.data().displayName || 'DELTA User') : 'DELTA User';
    await pdMc(id).collection('comments').add({
      authorUid: currentUser.uid, authorName: myName,
      text: text, createdAt: new Date().toISOString()
    });
    pdLoadComments(id);
  }catch(e){ alert('মন্তব্য পাঠাতে সমস্যা হয়েছে: '+e.message); }
}

auth.onAuthStateChanged(function(u){
  currentUser = u;
  loadProfile();
});
</script>
